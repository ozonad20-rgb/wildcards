<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wild Card VTT</title>
<meta name="description" content="Mesa virtual de Savage Worlds Edição Aventura: fichas, rolagens, combate com cartas de ação e galeria.">
<meta name="theme-color" content="#1d1b18">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='3' width='44' height='58' rx='7' fill='%23fbf9f4' stroke='%231d1b18' stroke-width='3' transform='rotate(-8 32 32)'/%3E%3Cpath transform='rotate(-8 32 32)' d='M32 18l4.4 9.6 10.4 1.1-7.8 7 2.2 10.3L32 40.7l-9.2 5.3 2.2-10.3-7.8-7 10.4-1.1z' fill='%23b3202a'/%3E%3Ctext x='15' y='17' transform='rotate(-8 32 32)' font-family='Georgia,serif' font-weight='900' font-size='12' fill='%23b3202a'%3EW%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231d1b18'/%3E%3Crect x='14' y='6' width='36' height='52' rx='6' fill='%23fbf9f4'/%3E%3Cpath d='M32 18l4.4 9.6 10.4 1.1-7.8 7 2.2 10.3L32 40.7l-9.2 5.3 2.2-10.3-7.8-7 10.4-1.1z' fill='%23b3202a'/%3E%3C/svg%3E">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* =====================================================================
   WILD CARD · estética: livro de regras e baralho de pôquer.
   Papel claro, tinta preta, vermelho de carta. Painéis como cartas
   (cantos arredondados, filete interno), naipes como ornamento.
   Layout: barra superior em tinta; conteúdo em painéis; ficha em duas
   colunas que vira uma no celular.
   ===================================================================== */
:root {
  --mesa: #ebe6dc; --papel: #fbf9f4; --papel2: #f4f0e7; --papel3: #ece6da;
  --linha: #ddd5c6; --linha2: #b9ae9b;
  --tinta: #1d1b18; --tinta2: #48433b; --mut: #6b6457;
  --verm: #b3202a; --verm2: #8c1820; --verm-cl: #f6e3e3;
  --azul: #2f5d8a; --verde: #2f7a4f; --ambar: #9a6a12; --ambar-cl: #f6ecd6;
  --f-disp: 'Bebas Neue', 'Oswald', Impact, sans-serif;
  --f-idx: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --f-ui: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'Courier New', monospace;
  --raio: 12px; --sombra: 0 1px 0 rgba(29, 27, 24, .06), 0 6px 18px -8px rgba(29, 27, 24, .28);
  --ease-ramp: cubic-bezier(.05, .9, .2, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--mesa); color: var(--tinta); font: 400 18px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; overflow-x: hidden;
  background-image: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255, 255, 255, .55), transparent 70%);
  background-attachment: fixed;
}
body.com-modal { overflow: hidden; }
::selection { background: var(--verm); color: #fff; }
a { color: var(--azul); }
img { max-width: 100%; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0 0 .6em; }
.mono { font-family: var(--f-mono); font-weight: 500; letter-spacing: 0; line-height: 1.1; font-variant-numeric: tabular-nums; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.flex1 { flex: 1; }
.dica { color: var(--mut); font-size: .92rem; margin: .4em 0; }
.centro { text-align: center; }
.lead { color: var(--tinta2); font-size: 1.08rem; max-width: 65ch; }
.erro { color: var(--verm); font-weight: 700; min-height: 1.2em; margin: 0; }
.txt-perigo { color: var(--verm); } .txt-quente { color: var(--ambar); } .ok-txt { color: var(--verde); font-weight: 700; }
.vazio { color: var(--mut); padding: 14px; text-align: center; }
.vazio.grande { padding: 40px 16px; display: grid; gap: 14px; justify-items: center; }
.pisca { animation: pisca 1.4s ease-in-out infinite; }
@keyframes pisca { 50% { opacity: .4; } }
:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }
svg { width: 1.1em; height: 1.1em; flex: none; vertical-align: -.16em; }

/* ---------- painéis (cartas) ---------- */
.win { position: relative; background: var(--papel); border: 1px solid var(--linha2); border-radius: var(--raio); box-shadow: var(--sombra); overflow: hidden; }
.win-bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 16px; min-height: 44px; border-bottom: 1px solid var(--linha); background: var(--papel2); color: var(--tinta); }
.win-tit { font: 400 1.25rem/1 var(--f-disp); letter-spacing: .05em; flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.win-tit::before { content: '♠'; font-family: var(--f-idx); color: var(--tinta); font-size: .95rem; }
.win-luzes { display: flex; gap: 6px; font-family: var(--f-idx); font-size: 1rem; }
.win-luzes i { font-style: normal; } .win-luzes i::before { content: '♥'; color: var(--verm); }
.win-luzes i:nth-child(2)::before { content: '♣'; color: var(--tinta); } .win-luzes i:nth-child(3)::before { content: '♦'; color: var(--verm); }
.win-x { background: transparent; color: var(--tinta2); border: 1px solid var(--linha2); width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; }
.win-x:hover { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
.win-body { padding: 18px; }

/* ---------- botões e campos ---------- */
.btn { --b: var(--linha2); display: inline-flex; align-items: center; justify-content: center; gap: .45em; font: 600 1rem/1.1 var(--f-ui);
  padding: .62em 1.1em; border: 1px solid var(--b); border-radius: 8px; background: var(--papel); color: var(--tinta); cursor: pointer;
  box-shadow: 0 1px 0 rgba(29, 27, 24, .12); transition: background .15s, transform .08s, box-shadow .15s; text-decoration: none; white-space: nowrap; min-height: 44px; }
.btn:hover:not(:disabled) { background: var(--papel3); }
.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.pri { background: var(--verm); color: #fff; --b: var(--verm2); }
.btn.pri:hover:not(:disabled) { background: var(--verm2); }
.btn.sec { background: var(--tinta); color: var(--papel); --b: var(--tinta); }
.btn.sec:hover:not(:disabled) { background: #3a362f; }
.btn.quente { background: var(--ambar-cl); color: #5e3f06; --b: #d4b06a; }
.btn.quente:hover:not(:disabled) { background: #efdcae; }
.btn.perigo { background: var(--papel); color: var(--verm); --b: var(--verm); }
.btn.perigo:hover:not(:disabled) { background: var(--verm-cl); }
.btn.benny { background: var(--verm); color: #fff; --b: var(--verm2); }
.btn.fant { background: transparent; box-shadow: none; }
.btn.fant:hover:not(:disabled) { background: rgba(29, 27, 24, .06); }
.btn.perigo-txt { color: var(--verm); }
.btn.olho { background: transparent; color: var(--tinta); --b: var(--tinta); box-shadow: none; }
.btn.olho:hover { background: var(--tinta); color: var(--papel); }
.btn.sm { font-size: .92rem; padding: .45em .8em; min-height: 36px; }
.btn.lg { font-size: 1.1rem; padding: .8em 1.4em; min-height: 52px; }
.btn.ico { padding: 0; width: 44px; min-width: 44px; }
.btn.ico.sm { width: 36px; min-width: 36px; height: 36px; }
.btn.largo { width: 100%; }
.linkbtn { background: none; border: 0; color: var(--azul); text-decoration: underline; cursor: pointer; font: inherit; font-size: .92rem; padding: 0 4px; }
.inp { font: 400 1rem/1.3 var(--f-ui); color: var(--tinta); background: #fff; border: 1px solid var(--linha2); border-radius: 8px; padding: .55em .75em; min-height: 44px; width: 100%; transition: border-color .15s, box-shadow .15s; }
.inp::placeholder { color: #958d7f; }
.inp:focus { outline: none; border-color: var(--tinta); box-shadow: 0 0 0 3px rgba(47, 93, 138, .22); }
.inp:disabled { opacity: .65; background: var(--papel2); }
textarea.inp { resize: vertical; min-height: 90px; line-height: 1.45; }
select.inp { cursor: pointer; padding-right: 1.9em; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--tinta2) 50%), linear-gradient(135deg, var(--tinta2) 50%, transparent 50%); background-position: calc(100% - 16px) 52%, calc(100% - 11px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.inp.curto { width: 110px; } .inp.mini-n { width: 74px; text-align: center; } .inp.lg { font-size: 1.25rem; }
.campo { display: grid; gap: 6px; }
.campo > span { font: 700 .8rem/1.2 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--tinta2); }
.campo.linha { grid-template-columns: auto 1fr; align-items: center; gap: 10px; }
.campo.mini > span { font-size: .74rem; }
.pilha { display: grid; gap: 14px; }
.linha2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
.chk { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.chk input { width: 20px; height: 20px; accent-color: var(--verm); }
.chk.bloco { display: flex; padding: 8px 0; border-bottom: 1px dashed var(--linha); }
.lbl { font: 700 .76rem/1.2 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--mut); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; background: var(--papel2); border: 1px solid var(--linha2); font-size: .84rem; font-weight: 600; color: var(--tinta2); }
.chip.mini { font-size: .74rem; padding: 0 7px; }
.chip.quente { background: var(--ambar-cl); border-color: #d4b06a; color: #6b4708; }
.chip.perigo { background: var(--verm-cl); border-color: #e2a9ad; color: var(--verm2); }
.chip.posto { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
.cont { display: inline-grid; place-items: center; min-width: 26px; padding: 0 7px; border-radius: 999px; background: var(--papel3); color: var(--tinta2); font: 600 .85rem/1.6 var(--f-mono); }
.seg { display: inline-flex; border: 1px solid var(--linha2); border-radius: 9px; overflow: hidden; background: var(--papel); }
.seg-b { background: transparent; color: var(--tinta2); border: 0; padding: .55em 1em; font: 600 1rem var(--f-ui); cursor: pointer; min-height: 42px; }
.seg-b + .seg-b { border-left: 1px solid var(--linha2); }
.seg-b.on { background: var(--tinta); color: var(--papel); }
.seg.mini .seg-b { font-size: .88rem; padding: .35em .75em; min-height: 34px; }
.toggle { border: 1px solid var(--linha2); background: var(--papel); color: var(--tinta2); border-radius: 999px; padding: .4em 1.1em; font: 600 .95rem var(--f-ui); cursor: pointer; min-height: 38px; }
.toggle.on { background: var(--verm); border-color: var(--verm2); color: #fff; }
.stepper { display: inline-flex; align-items: center; gap: 8px; }
.st-val { min-width: 2.6ch; text-align: center; font-size: 1.4rem; }
.st-val.ativo { color: var(--verm); }
.stepper.grande .st-val { font: 900 2rem var(--f-idx); min-width: 2ch; }
.modal-acoes { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; align-items: center; margin-top: 18px; }

/* ---------- logotipo ---------- */
.logo { display: flex; align-items: center; gap: 18px; justify-content: center; }
.logo-carta { position: relative; width: 74px; height: 104px; flex: none; border-radius: 9px; background: #fff; border: 1px solid var(--linha2); box-shadow: 0 6px 16px -6px rgba(29, 27, 24, .45); transform: rotate(-6deg); }
.logo-carta::after { content: ''; position: absolute; inset: 6px; border: 1px solid var(--verm); border-radius: 5px; opacity: .5; }
.lc-i { position: absolute; top: 6px; left: 8px; display: grid; justify-items: center; font: 900 1.05rem/1 var(--f-idx); color: var(--verm); }
.lc-i i { font-style: normal; font-size: .75rem; }
.lc-i.inv { top: auto; left: auto; bottom: 6px; right: 8px; transform: rotate(180deg); }
.lc-c { position: absolute; inset: 0; display: grid; place-items: center; font-size: 2.2rem; color: var(--verm); }
.logo-txt { display: grid; }
.logo-w { font: 400 clamp(3rem, 8vw, 4.4rem)/.9 var(--f-disp); letter-spacing: .03em; color: var(--tinta); }
.logo-sub { font: 700 .82rem var(--f-ui); letter-spacing: .2em; text-transform: uppercase; color: var(--verm); margin-top: 6px; }

/* ---------- splash e login ---------- */
.splash { min-height: 100vh; display: grid; place-content: center; gap: 24px; text-align: center; }
.splash-txt { color: var(--mut); font-weight: 600; }
.login { min-height: 100vh; display: grid; place-items: center; padding: 30px 16px; }
.login-box { width: min(480px, 100%); }
.login-corpo { padding: 28px 30px 24px; display: grid; gap: 22px; }
.login-corpo .logo-w { font-size: clamp(2.8rem, 10vw, 3.6rem); }
.login .seg { width: 100%; } .login .seg-b { flex: 1; }

/* ---------- barra superior ---------- */
.topo { position: sticky; top: 0; z-index: 50; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; padding: 10px 22px;
  background: var(--tinta); color: var(--papel); border-bottom: 3px solid var(--verm); }
.marca-p { font: 400 1.6rem/1 var(--f-disp); letter-spacing: .04em; display: flex; gap: 6px; align-items: center; }
.marca-p b { font-weight: 400; } .marca-p span { color: #ff8a8f; }
.topo-meio { min-width: 0; }
.topo-user { display: flex; align-items: center; gap: 10px; }
.avatar { width: 38px; height: 38px; border-radius: 7px; display: grid; place-items: center; background: var(--papel); color: var(--verm); font: 900 1.15rem var(--f-idx); }
.topo-nome { display: grid; line-height: 1.15; font-weight: 600; } .topo-nome small { color: #b8b1a4; font-weight: 400; font-size: .8rem; }
.topo .btn.fant { color: var(--papel); --b: #57524a; }
.topo .btn.fant:hover { background: #33302a; }
.topo-camp { display: flex; align-items: center; gap: 10px; min-width: 0; }
.topo-camp-nome { display: grid; line-height: 1.15; min-width: 0; } .topo-camp-nome b { font: 400 1.35rem var(--f-disp); letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 26ch; }
.topo-camp-nome small { color: #b8b1a4; font-size: .82rem; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; justify-content: center; }
.tab { position: relative; background: transparent; border: 0; color: #cfc8ba; font: 600 1.05rem var(--f-ui); padding: .55em 1.05em; border-radius: 8px; cursor: pointer; white-space: nowrap; min-height: 44px; }
.tab:hover { color: #fff; background: #2e2a24; }
.tab.on { color: var(--tinta); background: var(--papel); }
.tab.on::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: 6px; height: 2px; background: var(--verm); }
.ponto-vivo { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--verm); margin-left: 6px; vertical-align: 2px; animation: pisca 1.2s ease-in-out infinite; }

/* ---------- boas-vindas ---------- */
.home, .pagina { max-width: 1280px; margin: 0 auto; padding: 28px 20px 150px; display: grid; gap: 24px; align-content: start; }
.boas { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; }
.eyebrow { color: var(--verm); font: 700 .85rem var(--f-ui); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 6px; }
.tit-tela { font: 900 clamp(2.2rem, 5vw, 3.2rem)/1.05 var(--f-idx); margin-bottom: 8px; }
.tit-sec { font: 400 2rem/1 var(--f-disp); letter-spacing: .03em; margin-bottom: 6px; }
.tit-peq { font: 700 .82rem var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--verm); margin: 14px 0 8px; }
.boas-acoes { display: flex; flex-wrap: wrap; gap: 12px; }
.tabs-sub { display: flex; gap: 8px; margin-bottom: 18px; border-bottom: 1px solid var(--linha); }
.tab-sub { background: none; border: 0; border-bottom: 3px solid transparent; color: var(--tinta2); padding: 10px 14px; font: 600 1.05rem var(--f-ui); cursor: pointer; display: flex; gap: 8px; align-items: center; margin-bottom: -1px; min-height: 44px; }
.tab-sub.on { color: var(--tinta); border-bottom-color: var(--verm); }
.camp-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }
.camp-card { background: var(--papel); border: 1px solid var(--linha2); border-radius: var(--raio); overflow: hidden; display: grid; box-shadow: var(--sombra); transition: transform .2s var(--ease-ramp), box-shadow .2s; }
.camp-card:hover { transform: translateY(-3px); box-shadow: 0 14px 28px -12px rgba(29, 27, 24, .4); }
.camp-capa { position: relative; padding: 0; border: 0; background: none; cursor: pointer; display: block; }
.camp-capa .quadro { border-radius: 0; }
.selo { position: absolute; top: 10px; left: 10px; padding: 2px 10px; border-radius: 6px; font: 400 1rem var(--f-disp); letter-spacing: .06em; background: var(--papel); border: 1px solid var(--linha2); }
.selo.mestre { color: var(--verm); } .selo.jog { color: var(--tinta); }
.camp-info { padding: 14px 16px 16px; display: grid; gap: 6px; }
.camp-info h3 { font: 700 1.3rem/1.2 var(--f-idx); }
.meta { color: var(--mut); font-size: .94rem; margin: 0; }
.codigo { color: var(--verm); }
.camp-acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.aviso-modo { color: var(--mut); font-size: .92rem; display: flex; gap: 8px; align-items: center; justify-content: center; }

/* ---------- imagens enquadradas ---------- */
.quadro { position: relative; overflow: hidden; background: var(--papel3); display: grid; place-items: center; border-radius: 8px; }
.quadro img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none; }
.quadro.capa { aspect-ratio: 16/9; width: 100%; }
.quadro.retrato { aspect-ratio: 1; width: 100%; }
.quadro.arte { aspect-ratio: 4/3; width: 100%; border-radius: 4px; }
/* verso de carta de baralho para espaços vazios */
.quadro.vazio { background-color: #f7efe9; background-image:
  repeating-linear-gradient(45deg, rgba(179, 32, 42, .14) 0 2px, transparent 2px 12px),
  repeating-linear-gradient(-45deg, rgba(179, 32, 42, .14) 0 2px, transparent 2px 12px); }
.capa-vazia { color: var(--tinta2); font: 400 1.6rem var(--f-disp); letter-spacing: .04em; display: flex; gap: 8px; align-items: center; background: var(--papel); padding: 6px 14px; border-radius: 8px; border: 1px solid var(--linha2); }
.ret-vazio { color: var(--verm); font: 900 2.2rem var(--f-idx); background: var(--papel); width: 58%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--linha2); }
.ret-vazio svg { width: 40%; height: 40%; color: var(--tinta2); }
.capa-pick, .ret-edit { position: relative; display: block; width: 100%; padding: 0; border: 1px dashed var(--linha2); border-radius: 10px; background: none; cursor: pointer; overflow: hidden; color: inherit; }
.capa-pick:hover, .ret-edit:hover { border-color: var(--tinta); }
.ret-tag { position: absolute; right: 6px; bottom: 6px; background: var(--tinta); color: var(--papel); font-size: .8rem; font-weight: 600; padding: 2px 8px; border-radius: 5px; }
.faixa-capa { position: relative; max-width: 1280px; margin: 22px auto 0; padding: 0 20px; }
.faixa-capa .quadro.capa { aspect-ratio: 16/4.2; border: 1px solid var(--linha2); box-shadow: var(--sombra); border-radius: var(--raio); }
.faixa-capa .quadro.capa::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(20, 18, 15, .78), transparent 65%); }
.faixa-txt { position: absolute; left: 44px; bottom: 18px; right: 44px; color: #fff; z-index: 1; }
.faixa-txt h1 { font: 900 clamp(1.5rem, 3.4vw, 2.5rem)/1.05 var(--f-idx); }
.faixa-txt p { margin: 6px 0 0; font-weight: 600; opacity: .9; }

/* ajuste de imagem */
.m-aj { width: min(760px, 96vw); }
.aj-frame { position: relative; width: 100%; border: 2px solid var(--tinta); border-radius: 10px; overflow: hidden; cursor: grab; touch-action: none; background: var(--papel3); }
.aj-frame.arrastando { cursor: grabbing; }
.aj-frame .quadro { position: absolute; inset: 0; border-radius: 0; }
.aj-frame::after { content: ''; position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(255,255,255,.4) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.4) 1px, transparent 1px); background-size: 33.33% 33.33%; }
.aj-vazio { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 8px; border: 0; background: none; color: var(--tinta2); font: 600 1.1rem var(--f-ui); cursor: pointer; }
.aj-vazio svg { width: 48px; height: 48px; }
input[type=range] { accent-color: var(--verm); width: 100%; }

/* ---------- modal ---------- */

.modal-fundo { position: fixed; inset: 0; background: rgba(29, 27, 24, .45); backdrop-filter: blur(3px); }
.modal { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(640px, 94vw); max-height: 90vh; display: flex; flex-direction: column; animation: modalIn .22s var(--ease-ramp); box-shadow: 0 24px 60px -18px rgba(0, 0, 0, .5); }
.modal.estreito { width: min(440px, 94vw); } .modal.largo { width: min(980px, 96vw); }
.modal-corpo { padding: 20px; overflow-y: auto; }
@keyframes modalIn { from { opacity: 0; transform: translate(-50%, -46%) scale(.97); } }
.conf-txt { font-size: 1.08rem; }

/* ---------- área do mestre ---------- */
.gm-topo { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(320px, 1.2fr); gap: 22px; align-items: start; }
.codigo-grande { display: flex; align-items: center; justify-content: center; gap: 14px; width: 100%; font: 600 clamp(2rem, 4.4vw, 2.9rem) var(--f-mono); letter-spacing: .18em; padding: 16px; color: var(--tinta);
  background: #fff; border: 1px solid var(--linha2); border-radius: 10px; cursor: pointer; box-shadow: inset 0 0 0 5px #fff, inset 0 0 0 6px rgba(179, 32, 42, .4); }
.codigo-grande:hover { background: var(--papel2); }
.codigo-grande span { color: var(--mut); font-size: 1.3rem; letter-spacing: 0; }
.membros { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
.capa-card .win-body { display: grid; gap: 12px; }
.linha-cfg { display: grid; grid-template-columns: 1fr auto; gap: 12px; }
.gm-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
.gm-cols > div { display: grid; gap: 22px; }
.rol-gm { display: grid; gap: 16px; }
.rol-dados { display: flex; flex-wrap: wrap; gap: 8px; }
.dado-b { min-width: 64px; min-height: 54px; border: 1px solid var(--linha2); background: #fff; color: var(--tinta); border-radius: 10px; font: 700 1.25rem var(--f-idx); cursor: pointer; box-shadow: 0 1px 0 rgba(29, 27, 24, .12); }
.dado-b:hover { background: var(--papel2); }
.dado-b.on { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
.rol-linha { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.rol-opts { display: grid; gap: 8px; color: var(--tinta2); }
.lista-fichas { display: grid; gap: 8px; margin-top: 12px; }
.lf { display: grid; grid-template-columns: 1fr auto 170px auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--linha); border-radius: 10px; background: #fff; }
.lf-abrir { display: flex; gap: 12px; align-items: center; background: none; border: 0; color: inherit; text-align: left; cursor: pointer; font: inherit; min-width: 0; }

.lf-stats { color: var(--tinta2); font-size: .95rem; }
.npc-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-top: 12px; }
.npc-card { display: flex; gap: 10px; align-items: center; padding: 10px; border: 1px solid var(--linha); border-left: 4px solid var(--verm); border-radius: 10px; background: #fff; color: inherit; text-align: left; cursor: pointer; font: inherit; }
.npc-card:hover { border-color: var(--linha2); border-left-color: var(--verm2); background: var(--papel2); }
.npc-card b { display: block; } .npc-card small { display: block; color: var(--mut); font-size: .86rem; }
.rec-topo { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.rec-lista { display: grid; gap: 6px; margin: 12px 0; }
.rec-l { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--linha); background: #fff; }
.rec-l.on { border-color: #d4b06a; background: var(--ambar-cl); }
.rec-l small { color: var(--mut); }
.rec-hist { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; }
.rec-hist li { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--papel2); }

.rec-hist li.revertida { opacity: .55; text-decoration: line-through; }
.ferr { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ---------- caixas retráteis ---------- */
.box { background: var(--papel); border: 1px solid var(--linha2); border-radius: var(--raio); box-shadow: var(--sombra); }
.box-h { list-style: none; display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; user-select: none; min-height: 52px; border-radius: var(--raio); }
.box-h:hover { background: var(--papel2); }
.box-h::-webkit-details-marker { display: none; }
.box-h > span:first-child { font: 400 1.4rem/1 var(--f-disp); letter-spacing: .04em; flex: none; }
.box-h::before { content: '▸'; color: var(--verm); font-size: 1rem; transition: transform .15s; width: 12px; }
.box[open] > .box-h::before { transform: rotate(90deg); }
.box[open] > .box-h { border-bottom: 1px solid var(--linha); border-radius: var(--raio) var(--raio) 0 0; }
.box-res { color: var(--mut); font-size: .92rem; margin-left: auto; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.box-c { padding: 16px; }
details.sub { border-top: 1px dashed var(--linha); padding-top: 10px; margin-top: 12px; }

.add-linha { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.add-linha .inp { width: auto; flex: 1 1 200px; }

/* ---------- personagens ---------- */
.pers-topo { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; }
.pers-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
.pers-abrir { display: grid; grid-template-columns: 110px 1fr; gap: 16px; width: 100%; padding: 12px; background: var(--papel); border: 1px solid var(--linha2); border-radius: var(--raio); color: inherit; text-align: left; cursor: pointer; font: inherit; box-shadow: var(--sombra); transition: transform .2s var(--ease-ramp); }
.pers-abrir:hover { transform: translateY(-3px); border-color: var(--tinta2); }
.pers-info { display: grid; gap: 5px; align-content: start; }
.pers-info b { font: 700 1.25rem/1.15 var(--f-idx); } .pers-info small { color: var(--mut); }
.pers-stats { display: flex; gap: 12px; color: var(--tinta2); font-size: .92rem; }
.escolha-cria { display: grid; gap: 14px; }
.cria-op { display: grid; gap: 6px; text-align: left; padding: 18px; border: 1px solid var(--linha2); border-radius: 12px; background: #fff; color: inherit; cursor: pointer; font: inherit; }
.cria-op b { font: 700 1.15rem var(--f-idx); color: var(--tinta); } .cria-op span { color: var(--tinta2); }
.cria-op:hover { border-color: var(--verm); box-shadow: 0 0 0 3px var(--verm-cl); }

/* ---------- ficha ---------- */
.ficha { display: grid; gap: 18px; }
.ficha-topo .ft-corpo { display: grid; grid-template-columns: auto 128px 1fr auto; gap: 18px; align-items: center; padding: 18px; }
.ficha-topo .quadro.retrato, .ficha-topo .ret-edit { width: 128px; }
.ft-nome { font: 900 clamp(1.8rem, 3.6vw, 2.6rem)/1.05 var(--f-idx); }
.ft-sub { color: var(--tinta2); margin: 6px 0 8px; }
.ft-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.ft-id { display: grid; gap: 8px; min-width: 0; }
.ft-linha { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
.inp-nome { font: 700 1.5rem var(--f-idx); }
.ft-acoes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.modo-tag { font: 700 .74rem var(--f-ui); letter-spacing: .1em; text-transform: uppercase; background: var(--papel); border: 1px solid var(--linha2); color: var(--verde); padding: 3px 9px; border-radius: 999px; }
.modo-tag.ed { color: #6b4708; background: var(--ambar-cl); border-color: #d4b06a; }
.ficha.editando .ficha-topo { border-color: #d4b06a; box-shadow: 0 0 0 3px var(--ambar-cl), var(--sombra); }
.barra-rol { position: sticky; top: 72px; z-index: 20; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 14px; background: rgba(251, 249, 244, .96); backdrop-filter: blur(6px); border: 1px solid var(--linha2); border-radius: 12px; box-shadow: var(--sombra); }
.br-tit { font: 700 .8rem var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--tinta2); display: flex; gap: 6px; align-items: center; }
.ficha-cols { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); gap: 18px; align-items: start; }
.col-a, .col-b { display: grid; gap: 18px; }
.derivadas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.dv { position: relative; display: grid; justify-items: center; gap: 2px; padding: 14px 8px 12px; background: #fff; border: 1px solid var(--linha2); border-radius: 12px; text-align: center; box-shadow: var(--sombra); }
.dv::before { content: ''; position: absolute; inset: 4px; border: 1px solid var(--linha); border-radius: 9px; pointer-events: none; }
.dv b { font: 900 2.5rem/1 var(--f-idx); color: var(--tinta); font-variant-numeric: tabular-nums; }
.dv b small { font: 600 1rem var(--f-mono); color: var(--mut); }
.dv > span { font: 700 .76rem var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--verm); }
.dv > small { color: var(--mut); font-size: .76rem; }
.dv.ed .inp { text-align: center; }
.dv-ed { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; padding: 12px; border: 1px dashed #d4b06a; background: var(--ambar-cl); border-radius: 12px; }
.atr-grade { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
/* atributos como cartas de baralho com índice no canto */
.atr { position: relative; display: grid; justify-items: center; gap: 2px; padding: 22px 6px 12px; aspect-ratio: auto; border: 1px solid var(--linha2); border-radius: 10px; background: #fff; color: inherit; cursor: pointer; font: inherit; box-shadow: var(--sombra); transition: transform .15s var(--ease-ramp), box-shadow .15s; }
button.atr:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 12px 22px -12px rgba(29, 27, 24, .5); border-color: var(--tinta2); }
button.atr:active:not(:disabled) { transform: translateY(0); }
.atr:disabled { cursor: default; }
.atr-s { position: absolute; top: 6px; left: 8px; font: 700 .78rem var(--f-ui); letter-spacing: .06em; color: var(--verm); }
.atr-d { font: 900 2.2rem/1 var(--f-idx); color: var(--tinta); }
.atr-n { font-size: .85rem; color: var(--tinta2); font-weight: 600; }
.atr.ed { cursor: default; padding-top: 12px; } .sel-dado { text-align: center; font: 600 1.15rem var(--f-mono); }
.per-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.per-grade.mini { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.per { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 8px; padding: 8px 12px; min-height: 48px; border: 1px solid var(--linha); border-radius: 8px; background: #fff; color: inherit; cursor: pointer; font: inherit; text-align: left; }
.per:hover:not(:disabled) { border-color: var(--tinta2); background: var(--papel2); }
.per:disabled { cursor: default; }
.per-n { font-weight: 600; } .per-a { color: var(--mut); font-size: .78rem; } .per-d { color: var(--verm); font: 700 1.2rem var(--f-idx); }
.per.fraca { grid-template-columns: 1fr; min-height: 40px; font-size: .92rem; color: var(--tinta2); background: var(--papel2); }
.per-ed { display: grid; gap: 8px; }
.per-ed-l { display: grid; grid-template-columns: 1fr 120px auto; gap: 8px; align-items: center; }
.per-ed-l:has(input.inp) { grid-template-columns: 1fr 90px 120px auto; }
.per-ed-l small { color: var(--mut); }
.per-add { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; } .per-add .inp { flex: 1 1 200px; width: auto; }
.estado-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.est-bloco { display: grid; gap: 8px; align-content: start; }
.est-bloco.largo { grid-column: 1 / -1; }
.est-bloco .lbl small { text-transform: none; letter-spacing: 0; font-weight: 400; }
.pips { display: flex; gap: 8px; align-items: center; }
.pip { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--verm); background: #fff; cursor: pointer; }
.pip.on { background: var(--verm); box-shadow: inset 0 0 0 3px #fff; }
.pip.fadiga { border-color: var(--ambar); } .pip.fadiga.on { background: var(--ambar); }
.pip:disabled { cursor: default; }
.inc { font: 700 .72rem var(--f-ui); letter-spacing: .08em; padding: 3px 7px; border-radius: 5px; border: 1px solid var(--linha2); color: var(--mut); }
.inc.on { background: var(--verm); color: #fff; border-color: var(--verm); }
.bennies { display: flex; align-items: center; gap: 10px; }
/* Benny como ficha de pôquer */
.benny-n { display: grid; place-items: center; min-width: 56px; height: 56px; padding: 0 6px; border-radius: 999px; color: #fff; font: 900 1.5rem var(--f-idx); background: var(--verm); border: 4px dashed #fff; box-shadow: 0 0 0 3px var(--verm), 0 6px 12px -6px rgba(0, 0, 0, .5); }
.benny-n small { font: 600 .8rem var(--f-mono); color: #fff; }
.conds { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cond { border: 1px solid var(--linha2); background: #fff; color: var(--tinta2); border-radius: 999px; padding: .35em .85em; font: 600 .92rem var(--f-ui); cursor: pointer; min-height: 36px; }
.cond.on { background: var(--verm-cl); border-color: #e2a9ad; color: var(--verm2); }
.sel-cond { width: auto; min-width: 150px; min-height: 36px; padding-top: .3em; padding-bottom: .3em; }
.arc-linha { color: var(--tinta2); }
.arc-ed { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.armas { display: grid; gap: 8px; }
.arma { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--linha); border-left: 4px solid var(--tinta); border-radius: 8px; background: #fff; }
.arma-info { display: grid; gap: 2px; } .arma-info .mono { color: var(--verm); font-size: .95rem; } .arma-info small { color: var(--mut); }
.arma-bts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.tab-ed { display: grid; gap: 8px; }
.te-l { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px; border: 1px dashed var(--linha2); border-radius: 8px; background: #fff; }
.te-l .inp { width: auto; flex: 1 1 120px; } .te-l .inp.curto { flex: 0 1 120px; } .te-l .inp.mini-n { flex: 0 0 70px; }
.lista-simples { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.lista-simples li { padding: 6px 0; border-bottom: 1px dashed var(--linha); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lista-simples small { color: var(--mut); } .lista-simples .mono { color: var(--verm); }
.xp-barra { position: relative; height: 32px; border: 1px solid var(--linha2); border-radius: 8px; background: #fff; overflow: hidden; margin-bottom: 12px; }
.xp-fill { position: absolute; inset: 0 auto 0 0; background: repeating-linear-gradient(45deg, #e9c7c9 0 8px, #f3dcdd 8px 16px); border-right: 2px solid var(--verm); }
.xp-barra span { position: relative; display: grid; place-items: center; height: 100%; font-size: .92rem; }
.avancos { padding-left: 0; list-style: none; display: grid; gap: 6px; margin: 12px 0 0; }
.avancos li { padding: 6px 0; border-bottom: 1px dashed var(--linha); }
.avancos .mono { color: var(--verm); margin-right: 6px; } .avancos small { color: var(--mut); margin-left: 6px; }
.texto-livre { white-space: pre-wrap; }
.barra-salvar { position: sticky; bottom: 16px; z-index: 30; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: flex-end; padding: 12px 16px; margin-right: 96px; border: 1px solid #d4b06a; border-radius: 12px; background: rgba(246, 236, 214, .97); box-shadow: 0 12px 30px -12px rgba(29, 27, 24, .45); }
.barra-salvar span { margin-right: auto; color: #6b4708; font-weight: 700; }
.av-ops { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.av-op { display: grid; gap: 4px; text-align: left; padding: 14px; border: 1px solid var(--linha2); border-radius: 12px; background: #fff; color: inherit; font: inherit; cursor: pointer; }
.av-op b { color: var(--tinta); font-family: var(--f-idx); } .av-op span { color: var(--tinta2); font-size: .92rem; }
.av-op.on { border-color: var(--verm); box-shadow: 0 0 0 3px var(--verm-cl); }

.av-esc { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

/* ---------- catálogo ---------- */
.cat-topo { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.cat-topo .inp { flex: 1 1 220px; width: auto; }
.cat-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; max-height: 60vh; overflow-y: auto; padding: 2px; }
.cat-it { display: grid; gap: 4px; text-align: left; padding: 12px; border: 1px solid var(--linha); border-left: 5px solid var(--cc); border-radius: 8px; background: #fff; color: inherit; font: inherit; cursor: pointer; }
.cat-it:hover { border-color: var(--linha2); border-left-color: var(--cc); background: var(--papel2); }
.cat-it b { font: 700 1.05rem var(--f-idx); } .cat-tag { color: var(--cc); font-weight: 700; font-size: .8rem; } .cat-it span { color: var(--tinta2); font-size: .94rem; }

/* ---------- cartas (vantagens, complicações, poderes) ---------- */
.cartas-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 16px; }
[class*="grade"] > .vazio, .pastas > .vazio, .lista-fichas > .vazio { grid-column: 1 / -1; }
.carta-slot { display: grid; gap: 8px; align-content: start; }
.carta-btn { padding: 0; border: 0; background: none; cursor: zoom-in; display: block; width: 100%; border-radius: 14px; transition: transform .2s var(--ease-ramp); }
.carta-btn:hover { transform: translateY(-5px) rotate(-1deg); }
.carta-acoes { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.btn.olho span { font-size: .88rem; }
.carta { --cc: #2f5d8a; width: 100%; aspect-ratio: 63/88; font-size: 14px; color: var(--tinta); text-align: left; }
.carta-borda { height: 100%; display: flex; flex-direction: column; gap: 6px; padding: 9px; border-radius: 14px; background: #fff; border: 1px solid var(--linha2);
  box-shadow: inset 0 0 0 4px #fff, inset 0 0 0 6px var(--cc), 0 10px 24px -12px rgba(29, 27, 24, .55); }
.carta-nome { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 6px 9px; margin: 3px 3px 0; border-radius: 6px; background: var(--cc); color: #fff; font: 700 1.05em/1.1 var(--f-idx); }
.carta-nome span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.carta-selo { font: 700 .62em var(--f-ui); letter-spacing: .06em; text-transform: uppercase; background: #fff; color: var(--cc); padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
.carta-arte { margin: 0 3px; border-radius: 5px; overflow: hidden; border: 1px solid var(--linha2); }
.carta-arte .quadro.vazio { background-color: #fff; background-image: repeating-linear-gradient(45deg, color-mix(in srgb, var(--cc) 22%, transparent) 0 2px, transparent 2px 11px), repeating-linear-gradient(-45deg, color-mix(in srgb, var(--cc) 22%, transparent) 0 2px, transparent 2px 11px); }
.arte-vazia { font: 400 2.6em/1 var(--f-idx); color: var(--cc); background: #fff; width: 2em; height: 2em; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--cc); }
.carta-linha { margin: 0 3px; padding: 2px 4px; border-bottom: 1px solid var(--linha); font: 700 .72em var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--cc); }

      case 'basicas_red': if (h.alvo) e.semBasicas.push(h.alvo); break;
      case 'visao_escuro': e.visao = 'escuro'; break;
      case 'infravisao': if (e.visao !== 'escuro') e.visao = 'infra'; break;
      case 'construto': e.construto = true; break;
      case 'acao_adicional': e.acaoAdicional = true; break;

      case 'vantagem': if (h.alvo) e.vantagens.push(h.alvo); break;
      case 'complicacao': if (h.alvo) e.complicacoes.push({ nome: h.alvo, grav: op.grav }); break;

      case 'poder': if (h.alvo) e.poderes.push(h.alvo); break;
      case 'voo': e.voo = op.voo; break;
    }

}

class LocalDB {
  constructor(key) {
    this.key = key; this.map = lsGet(key, {}) || {}; this.subs = new Set();
    window.addEventListener('storage', ev => { if (ev.key === this.key) { this.map = lsGet(this.key, {}) || {}; this._emit(); } });
  }
  _save() { lsSet(this.key, this.map); this._emit(); }
  _emit() { queueMicrotask(() => this.subs.forEach(fn => { try { fn(); } catch (e) { console.error(e); } })); }
  _snap(path) { const d = this.map[path]; const id = path.split('/').pop(); return { id, exists: !!d, data: () => (d ? clone(d) : undefined), metadata: { fromCache: false, hasPendingWrites: false } }; }
  doc(path) {
    const self = this;
    return {
      id: path.split('/').pop(), path,
      async get() { return self._snap(path); },
      async set(data) { self.map[path] = clone(data); self._save(); },
      async update(data) { if (!self.map[path]) throw { code: 'invalid_argument', message: 'documento não existe' }; self.map[path] = deepMerge(self.map[path], clone(data)); self._save(); },
      async delete() { delete self.map[path]; self._save(); },
      onSnapshot(next) { const fn = () => next(self._snap(path)); self.subs.add(fn); fn(); return () => self.subs.delete(fn); },
      collection(sub) { return self.collection(path + '/' + sub); },
    };
  }
  collection(path, q = { w: [], o: null, l: 0 }) {
    const self = this;
    const run = () => {
      const depth = path.split('/').length + 1;
      let docs = Object.keys(self.map).filter(k => k.startsWith(path + '/') && k.split('/').length === depth).map(k => ({ k, d: self.map[k] }));
      for (const [f, op, v] of q.w) {
        docs = docs.filter(({ d }) => {
          const x = d[f];
          if (op === '==') return x === v;
          if (op === '!=') return x !== v;
          if (op === 'array-contains') return Array.isArray(x) && x.includes(v);
          if (op === 'in') return v.includes(x);
          if (op === '<') return x < v; if (op === '>') return x > v;
          if (op === '<=') return x <= v; if (op === '>=') return x >= v;
          return true;
        });
      }
      if (q.o) { const [f, dir] = q.o; docs.sort((a, b) => ((a.d[f] ?? Infinity) > (b.d[f] ?? Infinity) ? 1 : -1) * (dir === 'desc' ? -1 : 1)); }
      else docs.sort((a, b) => (a.k > b.k ? 1 : -1));
      if (q.l) docs = docs.slice(0, q.l);
      const arr = docs.map(({ k }) => self._snap(k));
      return { docs: arr, size: arr.length, empty: !arr.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
    };
    return {
      path,
      where(f, op, v) { return self.collection(path, { ...q, w: [...q.w, [f, op, v]] }); },
      orderBy(f, dir = 'asc') { return self.collection(path, { ...q, o: [f, dir] }); },
      limit(n) { return self.collection(path, { ...q, l: n }); },
      async get() { return run(); },
      onSnapshot(next) { let last = ''; const fn = () => { const r = run(); const sig = JSON.stringify(r.docs.map(d => [d.id, d.data()])); if (sig !== last) { last = sig; next(r); } }; self.subs.add(fn); fn(); return () => self.subs.delete(fn); },
      doc(id) { return self.doc(path + '/' + (id || uid())); },
      async add(data) { const r = self.doc(path + '/' + uid()); await r.set(data); return r; },
    };
  }
}

/* O Firestore não aceita lista dentro de lista: embrulha e desembrulha. */
const FB_ARR = '__arr';
function fbEnc(v) {
  if (Array.isArray(v)) return v.map(x => (Array.isArray(x) ? { [FB_ARR]: fbEnc(x) } : fbEnc(x)));
  if (v && typeof v === 'object') { const o = {}; for (const [k, x] of Object.entries(v)) if (x !== undefined) o[k] = fbEnc(x); return o; }
  return v;
}
function fbDec(v) {
  if (Array.isArray(v)) return v.map(fbDec);
  if (v && typeof v === 'object') {
    if (typeof v.toMillis === 'function') return v.toMillis();
    const ks = Object.keys(v);
    if (ks.length === 1 && ks[0] === FB_ARR && Array.isArray(v[FB_ARR])) return fbDec(v[FB_ARR]);
    const o = {}; for (const [k, x] of Object.entries(v)) o[k] = fbDec(x); return o;
  }
  return v;
}
const FB_ERROS = {
  'permission-denied': 'permission_denied', 'resource-exhausted': 'resource_exhausted',
  'unavailable': 'unavailable', 'not-found': 'not_found', 'invalid-argument': 'invalid_argument',
};
function fbErro(e) { const c = e && e.code; return Object.assign(new Error(e && e.message || 'erro'), { code: FB_ERROS[c] || c || 'desconhecido', original: e }); }

/* Adaptador com a mesma interface que o app já usa (doc/collection/onSnapshot). */
class FireDB {
  constructor(fs, m) { this.fs = fs; this.m = m; }
  _snap(s) { return { id: s.id, exists: s.exists(), data: () => (s.exists() ? fbDec(s.data()) : undefined), metadata: s.metadata }; }
  doc(path) {
    const self = this, m = this.m, r = m.doc(this.fs, path);
    return {
      id: r.id, path,
      async get() { try { return self._snap(await m.getDoc(r)); } catch (e) { throw fbErro(e); } },
      async set(data) { try { await m.setDoc(r, fbEnc(clone(data))); } catch (e) { throw fbErro(e); } },
      /* mesclagem profunda, como no banco local */
      async update(data) { try { await m.setDoc(r, fbEnc(clone(data)), { merge: true }); } catch (e) { throw fbErro(e); } },
      async delete() { try { await m.deleteDoc(r); } catch (e) { throw fbErro(e); } },
      onSnapshot(next, err) { return m.onSnapshot(r, s => next(self._snap(s)), e => err && err(fbErro(e))); },
      collection(sub) { return self.collection(path + '/' + sub); },
    };
  }
  collection(path, q = { w: [], o: null, l: 0 }) {
    const self = this, m = this.m;
    const build = () => {
      const parts = [];
      q.w.forEach(([f, op, v]) => parts.push(m.where(f, op, v)));
      if (q.o) parts.push(m.orderBy(q.o[0], q.o[1] || 'asc'));
      if (q.l) parts.push(m.limit(q.l));
      return m.query(m.collection(self.fs, path), ...parts);
    };
    const wrap = s => { const docs = s.docs.map(d => self._snap(d)); return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: s.metadata }; };
    return {
      path,
      where(f, op, v) { return self.collection(path, { ...q, w: [...q.w, [f, op, v]] }); },
      orderBy(f, dir = 'asc') { return self.collection(path, { ...q, o: [f, dir] }); },
      limit(n) { return self.collection(path, { ...q, l: n }); },
      async get() { try { return wrap(await m.getDocs(build())); } catch (e) { throw fbErro(e); } },
      onSnapshot(next, err) { return m.onSnapshot(build(), s => next(wrap(s)), e => err && err(fbErro(e))); },
      doc(id) { return self.doc(path + '/' + (id || uid())); },
      async add(data) { const r = self.doc(path + '/' + uid()); await r.set(data); return r; },
    };
  }
}

/* =====================================================================
   D — camada de dados que o app usa (Firebase, nuvem do Claude ou local)
   ===================================================================== */
const D = {
  raw: null, modo: 'local', fb: false, assets: null, userCap: null, podeEscrever: true,
  _filas: new Map(),
  /* com o Firebase ativo, apaga o que o antigo modo local guardava neste navegador
     (banco inteiro no localStorage e imagens no IndexedDB). Preferências pequenas de tela ficam. */
  limparLocal() {
    try {
      ['wildcard.db.v1', 'wc.sessao'].forEach(k => localStorage.removeItem(k));
      Object.keys(localStorage).filter(k => k.startsWith('wildcard.db')).forEach(k => localStorage.removeItem(k));
    } catch (e) { }
    try { indexedDB.deleteDatabase('wildcard-img'); } catch (e) { }
  },
  async iniciar() {
    try { this.raw = await FB.iniciar(); this.modo = 'nuvem'; this.fb = true; this.limparLocal(); return this.modo; }
    catch (e) { console.warn('Firebase indisponível, tentando outro modo', e); }
    let db = null;
    if (window.claude && typeof window.claude.use === 'function') {
      try {
        db = await Promise.race([window.claude.use('db'), sleep(9000).then(() => null)]);
        if (db) {
          try { this.assets = await Promise.race([window.claude.use('assets'), sleep(4000).then(() => null)]); } catch (e) { this.assets = null; }
          try { this.userCap = await Promise.race([window.claude.use('user'), sleep(4000).then(() => null)]); } catch (e) { this.userCap = null; }
        }
      } catch (e) { db = null; }
    }
    if (db) { this.raw = db; this.modo = 'nuvem'; }
    else { this.raw = new LocalDB('wildcard.db.v1'); this.modo = 'local'; }
    return this.modo;
  },
  ref(path) { return this.raw.doc(path); },
  col(path) { return this.raw.collection(path); },
  /* uma escrita por vez por documento */
  _enfileirar(path, fn) {
    const prev = this._filas.get(path) || Promise.resolve();
    const p = prev.catch(() => { }).then(fn);
    this._filas.set(path, p);
    p.finally(() => { if (this._filas.get(path) === p) this._filas.delete(path); });
    return p;
  },
  async _tentar(fn) {
    try { return await fn(); }
    catch (e) {
      if (e && e.code === 'unavailable') { await sleep(400 + Math.random() * 600); return fn(); }
      throw e;
    }
  },
  async get(path) { const s = await this._tentar(() => this.ref(path).get()); return s.exists ? { id: s.id, ...s.data() } : null; },
  set(path, data) { const d = { ...data }; delete d.id; return this._enfileirar(path, () => this._tentar(() => this.ref(path).set(d))).catch(e => this._erro(e)); },
  update(path, patch) { return this._enfileirar(path, () => this._tentar(() => this.ref(path).update(patch))).catch(e => this._erro(e)); },
  del(path) { return this._enfileirar(path, () => this._tentar(() => this.ref(path).delete())).catch(e => this._erro(e)); },
  async list(path, q = {}) {
    let c = this.col(path);
    (q.where || []).forEach(w => { c = c.where(...w); });
    if (q.orderBy) c = c.orderBy(...q.orderBy);
    if (q.limit) c = c.limit(q.limit);
    const s = await this._tentar(() => c.get());
    return s.docs.map(d => ({ id: d.id, ...d.data() }));
  },
  watchCol(path, q, cb) {
    let c = this.col(path);
    (q.where || []).forEach(w => { c = c.where(...w); });
    if (q.orderBy) c = c.orderBy(...q.orderBy);
    if (q.limit) c = c.limit(q.limit);
    return c.onSnapshot(s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => { console.warn('assinatura encerrada', path, e); if (e && e.code === 'revoked') this._erro(e); });
  },
  watchDoc(path, cb) {
    return this.ref(path).onSnapshot(s => cb(s.exists ? { id: s.id, ...s.data() } : null), e => console.warn('assinatura encerrada', path, e));
  },
  _erro(e) {
    const code = e && e.code;
    if (code === 'permission_denied') toast('O servidor recusou essa ação (regras do Firestore). Confira se você faz parte da campanha ou se está logado.', 'err', 8000);
    else if (code === 'invalid_argument' && this.modo === 'nuvem' && !this.fb) { this.podeEscrever = false; toast('Você está só com acesso de leitura a esta mesa. Peça ao dono do app para compartilhar com você como Editor.', 'err', 8000); }
    else if (code === 'quota_exceeded') toast('O espaço de dados da mesa está cheio. Apague imagens ou rolagens antigas.', 'err', 8000);
    else if (code === 'resource_exhausted') toast('Muitas ações em sequência. Espere um instante e tente de novo.', 'err');
    else if (code === 'revoked') toast('O acesso a esta mesa mudou. Recarregue a página.', 'err', 8000);
    else toast('Não consegui salvar agora. Confira a conexão e tente de novo.', 'err');
    console.error(e);
    throw e;
  },
};

/* =====================================================================
   CONTAS — usuário e senha (com hash PBKDF2)
   ===================================================================== */
const Conta = {
  norm(u) { return String(u || '').trim().toLowerCase(); },
  valido(u) { return /^[a-z0-9_.-]{3,20}$/.test(u); },
  async hash(senha, sal) {
    const enc = new TextEncoder();
    if (window.crypto && crypto.subtle) {
      const k = await crypto.subtle.importKey('raw', enc.encode(senha), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(sal), iterations: 120000, hash: 'SHA-256' }, k, 256);
      return 'p2$' + [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
    /* reserva simples se o navegador não tiver WebCrypto */
    let h = 2166136261; const s = sal + '|' + senha;
    for (let r = 0; r < 5000; r++) for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i) + r; h = Math.imul(h, 16777619) >>> 0; }
    return 'f1$' + h.toString(16);
  },
  async criar(u, nome, senha) {
    if (D.fb) return this.criarFb(u, nome, senha);
    u = this.norm(u);
    if (!this.valido(u)) throw new Error('Use de 3 a 20 caracteres: letras minúsculas, números, ponto, hífen ou sublinhado.');
    if (String(senha).length < 6) throw new Error('A senha precisa ter pelo menos 6 caracteres.');
    if (await D.get('accounts/' + u)) throw new Error('Esse nome de usuário já existe. Escolha outro ou entre na conta.');
    const sal = uid('s');
    const conta = { uname: u, nome: String(nome || u).trim().slice(0, 40) || u, sal, hash: await this.hash(senha, sal), criadoEm: Date.now() };
    await D.set('accounts/' + u, conta);
    return { uname: u, nome: conta.nome };
  },
  /* ---------- Firebase Authentication (e-mail e senha) ---------- */
  msgFb(e) {
    const c = (e && e.code) || '';
    const m = {
      'auth/invalid-email': 'Esse e-mail não parece válido.',
      'auth/missing-email': 'Digite seu e-mail.',
      'auth/missing-password': 'Digite sua senha.',
      'auth/email-already-in-use': 'Já existe uma conta com esse e-mail. Use “Entrar”.',
      'auth/weak-password': 'Senha fraca: use pelo menos 6 caracteres.',
      'auth/invalid-credential': 'E-mail ou senha incorretos.',
      'auth/wrong-password': 'E-mail ou senha incorretos.',
      'auth/user-not-found': 'E-mail ou senha incorretos.',
      'auth/user-disabled': 'Esta conta foi desativada.',
      'auth/too-many-requests': 'Muitas tentativas. Espere alguns minutos e tente de novo.',
      'auth/network-request-failed': 'Sem conexão com o servidor. Confira a internet.',
      'auth/operation-not-allowed': 'O login por e-mail e senha não está ativado no Firebase (Authentication → Sign-in method).',
    }[c];
    return new Error(m || (e && e.message) || 'Não consegui entrar agora.');
  },
  async perfilFb(u, nomePadrao) {
    let c = null;
    try { c = await D.get('accounts/' + u.uid); } catch (e) { }
    const nome = (c && c.nome) || u.displayName || nomePadrao || (u.email || '').split('@')[0] || 'Jogador';
    if (!c) { try { await D.ref('accounts/' + u.uid).set({ uname: u.uid, nome, email: u.email || '', criadoEm: Date.now() }); } catch (e) { console.warn(e); } }
    return { uname: u.uid, nome, email: u.email || '' };
  },
  async criarFb(email, nome, senha) {
    try {
      const cred = await FB.am.createUserWithEmailAndPassword(FB.auth, String(email).trim(), senha);
      nome = String(nome || '').trim().slice(0, 40) || String(email).split('@')[0];
      try { await FB.am.updateProfile(cred.user, { displayName: nome }); } catch (e) { }
      return await this.perfilFb(cred.user, nome);
    } catch (e) { throw e && String(e.code || '').startsWith('auth/') ? this.msgFb(e) : e; }
  },
  async entrarFb(email, senha) {
    try { const cred = await FB.am.signInWithEmailAndPassword(FB.auth, String(email).trim(), senha); return await this.perfilFb(cred.user); }
    catch (e) { throw e && String(e.code || '').startsWith('auth/') ? this.msgFb(e) : e; }
  },
  async recuperarFb(email) {
    try { await FB.am.sendPasswordResetEmail(FB.auth, String(email).trim()); }
    catch (e) { throw this.msgFb(e); }
  },
  async sairFb() { try { await FB.am.signOut(FB.auth); } catch (e) { } },
  async entrar(u, senha) {
    if (D.fb) return this.entrarFb(u, senha);
    u = this.norm(u);
    const c = await D.get('accounts/' + u);
    if (!c) throw new Error('Não encontrei esse usuário. Confira o nome ou crie uma conta.');
    if (await this.hash(senha, c.sal) !== c.hash) throw new Error('Senha incorreta.');
    return { uname: u, nome: c.nome || u };
  },
};

/* =====================================================================
   IMAGENS — redimensiona e guarda (assets do Claude, documento ou IndexedDB)
   referência: "a:<id>" asset · "d:<id>" documento · "i:<id>" IndexedDB
   ===================================================================== */
const Img = {
  cache: new Map(), carregando: new Set(), aoCarregar: null,
  _idb: null,
  idb() {
    if (this._idb) return this._idb;
    this._idb = new Promise((res, rej) => {
      try { const r = indexedDB.open('wildcard-img', 1); r.onupgradeneeded = () => r.result.createObjectStore('img'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
      catch (e) { rej(e); }
    });
    return this._idb;
  },
  async idbPut(k, v) { const db = await this.idb(); return new Promise((res, rej) => { const t = db.transaction('img', 'readwrite'); t.objectStore('img').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async idbGet(k) { const db = await this.idb(); return new Promise((res, rej) => { const t = db.transaction('img', 'readonly'); const r = t.objectStore('img').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async idbDel(k) { const db = await this.idb(); return new Promise(res => { const t = db.transaction('img', 'readwrite'); t.objectStore('img').delete(k); t.oncomplete = res; t.onerror = res; }); },
  carregarArquivo(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file); const im = new Image();
      im.onload = () => res({ im, url }); im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Não consegui abrir essa imagem.')); };
      im.src = url;
    });
  },
  async redimensionar(file, max, q = 0.84) {
    const { im, url } = await this.carregarArquivo(file);
    const s = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
    const w = Math.max(1, Math.round(im.naturalWidth * s)), h = Math.max(1, Math.round(im.naturalHeight * s));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d'); cx.fillStyle = '#120a24'; cx.fillRect(0, 0, w, h); cx.drawImage(im, 0, 0, w, h);
    URL.revokeObjectURL(url);
    return { cv, w, h };
  },
  dataURL(cv, q) { return cv.toDataURL('image/jpeg', q); },
  blob(cv, q) { return new Promise(r => cv.toBlob(r, 'image/jpeg', q)); },
  /* guarda e devolve a referência */
  async put(file, max = 1600) {
    if (!file || !/^image\//.test(file.type)) throw new Error('Escolha um arquivo de imagem.');
    if (D.modo === 'nuvem' && D.assets) {
      try {
        const { cv } = await this.redimensionar(file, max);
        const b = await this.blob(cv, 0.85);
        const r = await D.assets.upload(b);
        this.cache.set('a:' + r.id, r.url || '/_blob/' + r.id);
        return 'a:' + r.id;
      } catch (e) { console.warn('upload de asset falhou, guardando no documento', e); }
    }
    if (D.modo === 'nuvem') {
      let lado = Math.min(max, 1400), q = 0.8, src;
      for (let i = 0; i < 8; i++) {
        const { cv } = await this.redimensionar(file, lado);
        src = this.dataURL(cv, q);
        if (src.length < 230000) break;
        q = Math.max(0.5, q - 0.08); lado = Math.round(lado * 0.82);
      }
      const id = uid('im');
      await D.set('imgs/' + id, { src, criadoEm: Date.now(), dono: (typeof S !== 'undefined' && S.user && S.user.uname) || null });
      this.cache.set('d:' + id, src);
      return 'd:' + id;
    }
    const { cv } = await this.redimensionar(file, max);
    const src = this.dataURL(cv, 0.85); const id = uid('im');
    try { await this.idbPut(id, src); this.cache.set('i:' + id, src); return 'i:' + id; }
    catch (e) { return src; /* sem IndexedDB: guarda a imagem no próprio dado */ }
  },
  src(ref) {
    if (!ref) return '';
    if (ref.startsWith('data:')) return ref;
    if (this.cache.has(ref)) return this.cache.get(ref);
    if (ref.startsWith('a:')) { const u = '/_blob/' + ref.slice(2); this.cache.set(ref, u); return u; }
    if (!this.carregando.has(ref)) {
      this.carregando.add(ref);
      const fim = v => { this.cache.set(ref, v || ''); this.carregando.delete(ref); if (this.aoCarregar) this.aoCarregar(ref); };
      if (ref.startsWith('d:')) D.get('imgs/' + ref.slice(2)).then(d => fim(d && d.src)).catch(() => fim(''));
      else if (ref.startsWith('i:')) this.idbGet(ref.slice(2)).then(fim).catch(() => fim(''));
      else fim('');
    }
    return '';
  },
  async preload(refs) { await Promise.all((refs || []).filter(Boolean).map(r => new Promise(res => { if (this.src(r) || !this.carregando.has(r)) return res(); const t = setInterval(() => { if (!this.carregando.has(r)) { clearInterval(t); res(); } }, 60); setTimeout(() => { clearInterval(t); res(); }, 4000); }))); },
  async apagar(ref) {
    if (!ref) return;
    try {
      if (ref.startsWith('a:') && D.assets) await D.assets.delete(ref.slice(2));
      else if (ref.startsWith('d:')) await D.del('imgs/' + ref.slice(2));
      else if (ref.startsWith('i:')) await this.idbDel(ref.slice(2));
    } catch (e) { /* imagem já removida */ }
    this.cache.delete(ref);
  },
};
/* moldura com enquadramento ajustável: {ref, x, y, z} */
function quadro(img, cls = '', vazio = '') {
  const src = img && img.ref ? Img.src(img.ref) : '';
  const x = img && img.x != null ? img.x : 50, y = img && img.y != null ? img.y : 50, z = img && img.z ? img.z : 1;
  return `<div class="quadro ${cls} ${src ? '' : 'vazio'}">${src ? `<img src="${esc(src)}" alt="" draggable="false" style="object-position:${x}% ${y}%;transform:scale(${z});transform-origin:${x}% ${y}%">` : vazio}</div>`;
}

/* =====================================================================
   DADOS — rolagens do Savage Worlds
   ===================================================================== */
const Dado = {
  r(l) { const a = new Uint32Array(1); crypto.getRandomValues(a); return 1 + (a[0] % l); },
  /* rola um dado que explode no valor máximo */
  explode(lados, explodir = true) {
    const rolls = []; let t = 0, v;
    let guard = 0;
    do { v = this.r(lados); rolls.push(v); t += v; guard++; } while (explodir && lados > 1 && v === lados && guard < 50);
    return { lados, rolls, total: t };
  },
  /* teste de característica: dado + dado selvagem, fica o maior */
  teste({ dado = 4, bonus = 0, mod = 0, selvagem = true, alvo = 4, inexperiente = false }) {
    const t = this.explode(dado);
    const w = selvagem ? this.explode(6) : null;
    const modTotal = mod + bonus + (inexperiente ? -2 : 0);
    const vt = t.total + modTotal, vw = w ? w.total + modTotal : -Infinity;
    const usouSelvagem = w && vw > vt;
    const final = Math.max(vt, vw);
    const critico = selvagem ? (t.rolls[0] === 1 && w.rolls[0] === 1) : false;
    const sucesso = !critico && final >= alvo;
    const amp = sucesso ? Math.floor((final - alvo) / 4) : 0;
    return { tipo: 'teste', dado, t, w, mod: modTotal, final, usouSelvagem, critico, sucesso, amp, alvo };
  },
  /* expressão livre: "3d6+2", "For+d6", "2d8+1d6" */
  expressao(expr, ctx = {}, opts = {}) {
    const explodir = opts.explodir !== false;
    const src = String(expr || '').replace(/\s+/g, '').replace(/−/g, '-');
    if (!src) throw new Error('Expressão vazia');
    const partes = []; let total = 0;
    const toks = src.match(/[+-]?[^+-]+/g) || [];
    for (let tk of toks) {
      let sinal = 1; if (tk[0] === '-') { sinal = -1; tk = tk.slice(1); } else if (tk[0] === '+') tk = tk.slice(1);
      const low = tk.toLowerCase();
      let m;
      if (low === 'for' || low === 'str') {
        const fd = ctx.for || { d: 4, b: 0 };
        const r = this.explode(fd.d, explodir); const v = r.total + (fd.b || 0);
        partes.push({ rot: 'FOR d' + fd.d + (fd.b ? '+' + fd.b : ''), rolls: r.rolls, lados: fd.d, v: v * sinal }); total += v * sinal;
      } else if ((m = low.match(/^(\d*)d(\d+)$/))) {
        const n = Math.min(60, +(m[1] || 1)), l = +m[2];
        if (!l) throw new Error('Dado inválido: ' + tk);
        for (let i = 0; i < n; i++) { const r = this.explode(l, explodir); partes.push({ rot: 'd' + l, rolls: r.rolls, lados: l, v: r.total * sinal }); total += r.total * sinal; }
      } else if ((m = low.match(/^(\d+)-(\d+)d(\d+)$/))) {
        const n = +m[1], l = +m[3]; for (let i = 0; i < n; i++) { const r = this.explode(l, explodir); partes.push({ rot: 'd' + l, rolls: r.rolls, lados: l, v: r.total * sinal }); total += r.total * sinal; }
      } else if (/^\d+$/.test(low)) { partes.push({ rot: 'mod', v: +low * sinal }); total += +low * sinal; }
      else throw new Error('Não entendi “' + tk + '”. Use algo como 2d6+1 ou For+d8.');
    }
    return { tipo: 'expr', expr, partes, total };
  },
};
function rotDado(d, b) { return 'd' + d + (b ? (b > 0 ? '+' + b : b) : ''); }
function rollsHtml(rolls, lados) {
  return rolls.map((v, i) => `<i class="dd ${v === lados ? 'ace' : ''} ${v === 1 && i === 0 ? 'um' : ''}">${v}</i>`).join('<b class="ex">›</b>');
}

/* ---------- avisos ---------- */
function toast(html, tipo = '', ms = 3800) {
  let box = $('#toasts'); if (!box) { box = document.createElement('div'); box.id = 'toasts'; box.setAttribute('aria-live', 'polite'); document.body.appendChild(box); }
  const el = document.createElement('div'); el.className = 'toast ' + tipo; el.innerHTML = html; box.appendChild(el);
  while (box.children.length > 3) box.firstElementChild.remove();
  setTimeout(() => { el.classList.add('sai'); setTimeout(() => el.remove(), 400); }, ms);
}

<script>
/* =====================================================================
   WILD CARD · fichas de personagem (modo de uso e modo de edição),
   cartas de vantagens/complicações/poderes, avanços e assistente
   ===================================================================== */
'use strict';

/* ---------- modelo ---------- */
const T = (d = 4, b = 0) => ({ d, b });
function novaFicha(dono) {
  return {
    tipo: 'pc', dono: dono || null, criador: S.user.uname, nome: '', conceito: '', raca: 'Humano', retrato: null,
    atr: { agi: T(), ast: T(), esp: T(), for: T(), vig: T() },
    per: {}, perExtras: [],
    vantagens: [], complicacoes: [], poderes: [],
    arcano: { tipo: '', pericia: '', pp: 0, ppMax: 0 },
    armas: [], armaduras: [], itens: [], dinheiro: 500,
    mov: 6, dadoCorrida: 6, tamanho: 0, apararBonus: 0, resBonus: 0,
    bennies: 3, benniesBase: 3, feridas: 0, fadiga: 0, abalado: false, condicoes: [],
    xp: 0, avancos: [], historia: '', notas: '', carta: 'selvagem',

}
function normFicha(f) {

  o.atr = { ...b.atr, ...(f.atr || {}) };
  for (const k of ['per']) o[k] = { ...(f[k] || {}) };
  for (const k of ['perExtras', 'vantagens', 'complicacoes', 'poderes', 'armas', 'armaduras', 'itens', 'avancos', 'condicoes']) o[k] = Array.isArray(f[k]) ? f[k] : [];

}
const traitTxt = t => t ? 'd' + t.d + (t.b ? (t.b > 0 ? '+' + t.b : t.b) : '') : '—';
const traitVal = t => t ? t.d + (t.b || 0) * 2 : 0;
function podeControlarFicha(f) { return !!f && (S.gm || f.dono === S.user.uname); }
function xpPorAvanco() { return (S.camp && S.camp.xpPorAvanco) || 5; }

const BONUS_VANT = {
  'Prontidão': { perceber: 2 }, 'Ameaçador': { intimidar: 2 }, 'Curandeiro': { curar: 2 }, 'Investigador': { pesquisar: 2 },
  'Senhor Conserta Tudo': { consertar: 2 }, 'Ladrão': { ladinagem: 1 }, 'Mateiro': { sobrevivencia: 2 },
  'Atraente': { desempenho: 1, persuadir: 1 }, 'Muito Atraente': { desempenho: 1, persuadir: 1 },
};
const BONUS_COMP = {
  'Atrapalhado': { atletismo: -2, furtividade: -2 }, 'Sem Noção': { conhecimento_geral: -1, perceber: -1 }, 'Almofadinha': { intimidar: -2 },
  'Língua Presa': { intimidar: -1, persuadir: -1, provocar: -1 }, 'Desagradável': { persuadir: -1 },
};
function racaDaFicha(f) {
  if (f.racaDados && f.racaDados.habs) return f.racaDados;
  const r = (S.racas || []).find(x => x.id === f.racaId);
  return r || null;
}
const passoDado = (d, n) => DADOS[clamp(DADOS.indexOf(d) + n, 0, DADOS.length - 1)] || d;
/* ---------- automação de vantagens em ataques e dano ---------- */
const ehDesarmado = a => !!a && (/desarmad|punho|soco|chute|m[aã]os nuas|briga|pancada/i.test(a.nome || '') || /^for$/i.test(String(a.dano || '').trim()));
const vantItens = (f, ...nomes) => (f.vantagens || []).filter(v => nomes.includes(nomeLivro(v.nome)));
/* Arma Predileta vale para a arma citada na nota da vantagem (ou no nome, entre parênteses); sem nota e com uma só arma, vale para ela */
function armaPredileta(f, a) {
  const ap = vantItens(f, 'Arma Predileta', 'Arma Predileta Aprimorada'); if (!ap.length || !a) return 0;
  const nm = String(a.nome || '').toLowerCase().trim(); const txts = ap.map(x => `${x.nota || ''} ${(x.nome || '').replace(/^[^(]*\(?/, '')}`.toLowerCase());
  const temAlvo = ap.some(x => (x.nota || '').trim() || /\(/.test(x.nome || ''));
  const casa = nm && txts.some(t => t.includes(nm) || t.split(/[,;/]| e /).map(z => z.replace(/[()]/g, '').trim()).filter(z => z.length > 2).some(z => nm.includes(z)));

  const ap = armaPredileta(f, a); if (ap) atq.push([ap > 1 ? 'Arma Predileta Aprimorada' : 'Arma Predileta', ap]);
  if (per === 'lutar' && ehDesarmado(a)) { if (v.has('Guerreiro Marcial')) atq.push(['Guerreiro Marcial', 2]); else if (v.has('Artista Marcial')) atq.push(['Artista Marcial', 1]); }
  if (per === 'atirar' && v.has('Disparo Duplo')) atq.push(['Disparo Duplo', 1]);
  return atq;
}
/* expressão de dano já com dados desarmados das vantagens, dado de ampliação (Mestre de Arma) e Disparo Duplo */
function danoPc(f, a, per, amp) {
  const v = deriv(f).v; const notas = [];
  let expr = String((a && a.dano) || 'For').trim().replace(/^1-3d6$/, '3d6');
  if (per === 'lutar' && ehDesarmado(a) && /^for$/i.test(expr)) {
    const marc = v.has('Artista Marcial'), bri = v.has('Brigão'); let d = marc || bri ? (marc && bri ? 6 : 4) : 0;
    if (d && v.has('Guerreiro Marcial')) d = passoDado(d, 1); if (d && v.has('Pugilista')) d = passoDado(d, 1);
    if (d) { expr = 'For+d' + d; notas.push(`desarmado d${d} (${[marc && 'Artista Marcial', bri && 'Brigão'].filter(Boolean).join(' + ')})`); }
  }
  if (amp) {
    let dd = 6; if (per === 'lutar') { if (v.has('Mestre das Armas')) dd = 10; else if (v.has('Mestre de Arma')) dd = 8; }
    expr += '+d' + dd; notas.push('ampliação +d' + dd + (dd > 6 ? ' (Mestre de Arma)' : ''));
  }

  return { expr, notas };
}
function deriv(f) {
  const v = new Set((f.vantagens || []).map(x => nomeLivro(x.nome)));
  const c = {}; (f.complicacoes || []).forEach(x => { c[nomeLivro(x.nome)] = x.grav || 'menor'; });
  const r = racaDaFicha(f); const re = racaEf(r);
  const lut = f.per && f.per.lutar;
  let aparar = 2 + (lut ? Math.floor(lut.d / 2) + Math.floor((lut.b || 0) / 2) : 0) + (+f.apararBonus || 0) + re.aparar;
  if (v.has('Bloquear Aprimorado')) aparar += 2; else if (v.has('Bloquear')) aparar += 1;
  if (v.has('Mestre das Armas')) aparar += 2; else if (v.has('Mestre de Arma')) aparar += 1;
  const usando = (f.armaduras || []).filter(a => a.usando !== false);
  usando.forEach(a => { aparar += +a.aparar || 0; });
  let tam = (+f.tamanho || 0) + re.tamanho; if (v.has('Musculoso')) tam += 1; if (c['Obeso']) tam += 1; if (c['Pequeno']) tam -= 1;
  const vig = f.atr.vig || T();
  let resBase = 2 + Math.floor(vig.d / 2) + Math.floor((vig.b || 0) / 2) + tam + (+f.resBonus || 0) + re.res;
  if (v.has('Brigão')) resBase += 1; if (v.has('Pugilista')) resBase += 1;

function montarTeste(f, tipo, k, extra = {}) {

  } else if (tipo === 'per') {
    t = f.per[k]; nome = PER[k] ? PER[k].nome : k;
    if (!t) { t = T(4); inex = true; notas.push('sem treino (d4−2)'); }
    for (const [vn, m] of Object.entries(BONUS_VANT)) if (d.v.has(vn) && m[k]) { bon += m[k]; notas.push(vn + ' ' + fmtMod(m[k])); }
    for (const [cn, m] of Object.entries(BONUS_COMP)) if (d.c[cn] && m[k]) { bon += m[k]; notas.push(cn + ' ' + fmtMod(m[k])); }
    if (d.c['Feio'] && k === 'persuadir') { const p = d.c['Feio'] === 'maior' ? -2 : -1; bon += p; notas.push('Feio ' + fmtMod(p)); }
    if (d.c['Lento'] === 'maior' && k === 'atletismo') { bon -= 2; notas.push('Lento −2'); }
    if (d.re.bonusPer[k]) { bon += d.re.bonusPer[k]; notas.push('raça ' + fmtMod(d.re.bonusPer[k])); }
    if (d.re.penPer[k]) { bon += d.re.penPer[k]; notas.push('raça ' + fmtMod(d.re.penPer[k])); }
    if (k === 'perceber' && extra.luz !== false) { const pl = penLuz(d.re); if (pl) { bon += pl; notas.push('iluminação ' + fmtMod(pl)); } }
  } else if (tipo === 'extra') { const pe = (f.perExtras || []).find(x => x.id === k); t = pe; nome = pe.nome; }
  let gratis = null;
  if (tipo === 'per') {
    if (k === 'persuadir' && d.v.has('Carismático')) gratis = 'Carismático';
    else if (k === 'provocar' && d.v.has('Humilhar')) gratis = 'Humilhar';
    else if (k === 'atletismo' && d.v.has('Acrobata')) gratis = 'Acrobata · só acrobacia, equilíbrio e salto';
  }
  if (d.pen) notas.push(`ferimentos/fadiga/condições ${fmtMod(d.pen)}`);
  const carta = cartaDoCombate('pc:' + f.id);
  if (carta && carta.curinga) { bon += 2; notas.push('Curinga +2'); }
  const mod = (extra.mod || 0) + d.pen + bon;
  if (extra.notas) notas.push(...extra.notas);
  return { titulo: extra.titulo || nome, dado: t.d, bonus: t.b || 0, mod, selvagem: f.carta !== 'extra', inexperiente: inex, personagem: f.nome || 'Sem nome', fichaId: f.id, notas, alvo: extra.alvo || 4, gratis: extra.semGratis ? null : gratis };

/* ---------- requisitos de vantagens: confere posto, Carta Selvagem, atributos, perícias e outras vantagens ---------- */
const POSTO_ORD = Object.fromEntries(POSTOS.map(([n], i) => [n, i]));
function normTxt(t) { return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); }
function dadoDeTrait(f, nome) {
  const n = normTxt(nome);
  const a = ATRIBUTOS.find(([, an]) => normTxt(an) === n); if (a) return { v: traitVal(f.atr[a[0]]), ok: true };
  const p = PERICIAS.find(([, pn]) => normTxt(pn) === n || normTxt(pn).startsWith(n)); if (p) return { v: f.per[p[0]] ? traitVal(f.per[p[0]]) : 0, ok: true };
  const px = (f.perExtras || []).find(x => normTxt(x.nome).startsWith(n)); if (px) return { v: traitVal(px), ok: true };
  return { v: 0, ok: false };
}
function checarReq(f, req) {
  const falta = [], duvida = []; if (!f || !req) return { ok: true, falta, duvida };
  const nAv = (f.avancos || []).length; const posto = postoDe(nAv);
  const vs = new Set((f.vantagens || []).map(v => normTxt(nomeLivro(v.nome))));
  String(req).split(',').map(x => x.trim()).filter(Boolean).forEach(parte => {
    if (POSTO_ORD[parte] != null) { if (POSTO_ORD[posto] < POSTO_ORD[parte]) falta.push(parte); return; }
    if (/^carta selvagem$/i.test(parte)) { if (f.carta === 'extra') falta.push('Carta Selvagem'); return; }
    const m = parte.match(/^(.+?)\s+d(4|6|8|10|12)$/i);
    if (m) {
      const alts = m[1].split(/\s+ou\s+/i); const alvo = +m[2] + 0;
      const res = alts.map(x => dadoDeTrait(f, x));
      if (!res.some(r => r.ok)) { duvida.push(parte); return; }
      if (!res.some(r => r.ok && r.v >= alvo)) falta.push(parte);
      return;
    }
    if (vs.has(normTxt(parte))) return;
    if (VANTAGENS.some(v => normTxt(v[0]) === normTxt(parte))) { falta.push(parte); return; }
    duvida.push(parte);
  });
  return { ok: !falta.length, falta, duvida };
}

    ${chave === 'vantagens' && ficha ? `<label class="chk"><input type="checkbox" id="catOk" ${soOk ? 'checked' : ''}> Só as que ${esc(ficha.nome || 'o personagem')} pode pegar</label>` : ''}</div>

function wizBase(f) {
  const e = racaEf(f.racaDados);
  const atr = k => passoDado(4, e.atrIni[k] || 0);
  const per = k => e.perIni[k] || (PERICIAS_BASICAS.includes(k) && !e.semBasicas.includes(k) ? 4 : 0);

}
function wizPontos() {
  const w = S.wiz, f = w.f; const B = wizBase(f);
  const comp = Math.min(4, f.complicacoes.filter(c => !c.racial).reduce((s, c) => s + (c.grav === 'maior' ? 2 : 1), 0));
  const gastoComp = w.extra.atr * 2 + w.extra.vant * 2 + w.extra.per + w.extra.din;
  const atrTotal = 5 + w.extra.atr;
  const atrGasto = ATRIBUTOS.reduce((s, [k]) => s + Math.max(0, f.atr[k].d - B.atr(k)) / 2, 0);
  const perTotal = 12 + w.extra.per;
  let perGasto = 0;
  for (const [k, , a] of PERICIAS) {
    const t = f.per[k]; if (!t) continue;
    const base = B.per(k) || 2;
    for (let d = base + 2; d <= t.d; d += 2) perGasto += d <= 4 ? 1 : (d > f.atr[a].d ? 2 : 1);
  }
  const vantTotal = B.e.vantExtra + w.extra.vant;
  const vantGasto = f.vantagens.filter(x => !x.racial).length;
  const v = new Set(f.vantagens.map(x => x.nome));
  const mult = v.has('Podre de Rico') ? 5 : v.has('Rico') ? 3 : f.complicacoes.some(c => c.nome === 'Pobreza') ? 0.5 : 1;
  const dinheiroInicial = 500 * mult + 500 * w.extra.din;
  return { comp, gastoComp, atrTotal, atrGasto, perTotal, perGasto, vantTotal, vantGasto, dinheiroInicial };
}

}
