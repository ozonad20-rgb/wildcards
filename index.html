  const card = p => {
    const imgs = galImgs(p.id); const prev = imgs.slice(0, 3);
    return `<button class="pasta" data-a="galAbrir" data-id="${p.id}">
      <span class="pasta-capa n${prev.length}">${prev.length ? prev.map(i => `<img src="${esc(Img.src(i.ref))}" alt="" loading="lazy">`).join('') : `<span class="pasta-vz">${ICO.img}</span>`}</span>
      <span class="pasta-info"><b>${esc(p.nome || 'Sem nome')}</b><small>${plural(imgs.length)} · ${p.dono === S.user.uname ? 'sua' : esc(nomeDe(p.dono))}</small>
      <span class="pasta-selos"><span class="chip mini">${p.visivel ? 'visível' : 'privada'}</span>${p.colaborativa ? '<span class="chip mini">colaborativa</span>' : ''}</span></span></button>`;
  };
  const doM = vis.filter(p => p.doMestre), doJ = vis.filter(p => !p.doMestre);
  const nova = `<button class="pasta nova" data-a="galNova"><span class="pasta-capa"><span class="pasta-vz">${ICO.mais}</span></span><span class="pasta-info"><b>Nova pasta</b><small>Mapas, retratos, pistas, cenas…</small></span></button>`;
  return `<div class="sec-topo"><h2 class="tit-sec">Galeria</h2><span class="flex1"></span><button class="btn sec" data-a="galApresentar">${ICO.olho} Apresentar à mesa</button><button class="btn pri" data-a="galNova">${ICO.mais} Nova pasta</button></div>
    <h3 class="gal-secao">Do mestre <span class="cont">${doM.length}</span></h3>
    <div class="pastas">${doM.map(card).join('')}${S.gm ? nova : ''}${!doM.length && !S.gm ? '<p class="vazio">O mestre ainda não compartilhou pastas.</p>' : ''}</div>
    <h3 class="gal-secao">Dos jogadores <span class="cont">${doJ.length}</span></h3>
    <div class="pastas">${doJ.map(card).join('')}${!S.gm ? nova : ''}${!doJ.length && S.gm ? '<p class="vazio">Nenhuma pasta de jogador visível.</p>' : ''}</div>`;
}
function viewPasta(p) {
  const ed = galEditar(p), dono = galDono(p);
  const imgs = galImgs(p.id); const tags = p.tags || []; const porId = Object.fromEntries(tags.map(t => [t.id, t]));
  const filtro = S.gal.filtro[p.id] || [];
  const tagsDe = i => (i.tags || []).filter(t => porId[t]);
  const vis = filtro.length ? imgs.filter(i => filtro.some(f => f === '__sem' ? !tagsDe(i).length : tagsDe(i).includes(f))) : imgs;
  const cont = {}; imgs.forEach(i => tagsDe(i).forEach(t => { cont[t] = (cont[t] || 0) + 1; }));
  return `<div class="gal-topo"><button class="btn fant" data-a="galVoltar">${ICO.voltar} Galeria</button>
      ${dono ? `<input class="inp gal-nome" id="galNome" data-c="galNome" value="${esc(p.nome)}" aria-label="Nome da pasta">` : `<h2 class="tit-sec">${esc(p.nome)}</h2>`}
      <span class="dica mono">${plural(imgs.length)}${p.dono !== S.user.uname ? ' · de ' + esc(nomeDe(p.dono)) : ''}</span></div>
    ${dono ? `<div class="gal-opcoes"><div class="seg" role="group" aria-label="Visibilidade"><button class="seg-b ${!p.visivel ? 'on' : ''}" data-a="galVis" data-v="0">Privada</button><button class="seg-b ${p.visivel ? 'on' : ''}" data-a="galVis" data-v="1">Visível para a mesa</button></div>
      <button class="toggle ${p.colaborativa ? 'on' : ''}" data-a="galColab" aria-pressed="${!!p.colaborativa}" title="Quem vê a pasta também pode adicionar imagens">Colaborativa</button><span class="flex1"></span>
      <button class="btn sm fant perigo-txt" data-a="galDelPasta">${ICO.lixo} Excluir pasta</button></div>` : ''}
    ${ed ? `<label class="gal-drop" id="galDrop"><span class="gal-drop-ico">${ICO.img}</span><span><b>Adicionar imagens</b><small>Clique para escolher ou arraste arquivos para cá.</small></span><span id="galStatus" class="mono"></span><input type="file" id="galUp" accept="image/*" multiple hidden></label>` : ''}
    ${tags.length || ed ? `<div class="gal-tags"><span class="lbl">Tags</span>${tags.map(t => `<button class="gtag ${filtro.includes(t.id) ? 'on' : ''}" style="--tc:${t.cor}" data-a="galFiltro" data-t="${t.id}"><i></i>${esc(t.nome)}<span>${cont[t.id] || 0}</span></button>${ed ? `<button class="gtag-x" data-a="galTagDel" data-t="${t.id}" aria-label="Excluir tag ${esc(t.nome)}">${ICO.x}</button>` : ''}`).join('')}
      ${tags.length ? `<button class="gtag ${filtro.includes('__sem') ? 'on' : ''}" style="--tc:#8a7fb0" data-a="galFiltro" data-t="__sem"><i></i>Sem tag</button>` : ''}
      ${filtro.length ? '<button class="linkbtn" data-a="galFiltroLimpar">limpar filtro</button>' : ''}<span class="flex1"></span>
      ${ed ? `<form data-f="galTagNova" class="gtag-nova"><input class="inp" id="galTagNova" maxlength="24" placeholder="Nova tag" aria-label="Nova tag"><button class="btn sm sec">${ICO.mais}</button></form>` : ''}</div>` : ''}
    <div class="gal-grade">${vis.map(i => `<figure class="gal-item">
      <button class="gal-thumb" data-a="galVer" data-id="${i.id}" aria-label="Ampliar ${esc(i.legenda || 'imagem')}"><img src="${esc(Img.src(i.ref))}" alt="${esc(i.legenda || '')}" loading="lazy"></button>
      ${tagsDe(i).length ? `<div class="gal-item-tags">${tagsDe(i).map(t => `<span style="--tc:${porId[t].cor}">${esc(porId[t].nome)}</span>`).join('')}</div>` : ''}
      <figcaption>${ed ? `<input class="inp leg" id="leg_${i.id}" data-c="galLegenda" data-id="${i.id}" value="${esc(i.legenda || '')}" placeholder="Legenda" aria-label="Legenda">` : esc(i.legenda || '')}</figcaption>
      <div class="gal-bts">
        <button class="btn olho sm" data-a="galMesa" data-id="${i.id}" title="Mostrar à mesa" aria-label="Mostrar à mesa">${ICO.olho}</button>
        ${ed && tags.length ? `<button class="btn ico sm fant" data-a="galTagImg" data-id="${i.id}" title="Tags" aria-label="Tags da imagem">#</button>` : ''}
        ${dono || i.dono === S.user.uname ? `<button class="btn ico sm fant perigo-txt" data-a="galDelImg" data-id="${i.id}" title="Remover" aria-label="Remover imagem">${ICO.lixo}</button>` : ''}
      </div></figure>`).join('') || `<p class="vazio">${imgs.length ? 'Nenhuma imagem com essas tags.' : 'Pasta vazia.' + (ed ? ' Use a área acima para adicionar.' : '')}</p>`}</div>`;
}
AF.push(() => {
  const up = $('#galUp'); if (up) up.onchange = () => { const f = [...(up.files || [])]; up.value = ''; if (f.length) galEnviar(f); };
  const dr = $('#galDrop'); if (dr) {
    ['dragenter', 'dragover'].forEach(t => dr.addEventListener(t, e => { e.preventDefault(); dr.classList.add('sobre'); }));
    ['dragleave', 'drop'].forEach(t => dr.addEventListener(t, e => { e.preventDefault(); dr.classList.remove('sobre'); }));
    dr.addEventListener('drop', e => { const f = [...((e.dataTransfer && e.dataTransfer.files) || [])]; if (f.length) galEnviar(f); });
  }
});
async function galEnviar(files) {
  const st = $('#galStatus'); let n = 0;
  for (const f of files.filter(x => /^image\//.test(x.type))) {
    if (st) st.textContent = `Enviando ${n + 1}/${files.length}…`;
    try { const ref = await Img.put(f, 1800); await D.set(cpath('imagens/' + uid('gi')), { pasta: S.gal.pasta, ref, legenda: f.name.replace(/\.[^.]+$/, '').slice(0, 60), tags: [], dono: S.user.uname, criadoEm: Date.now() + n }); n++; }
    catch (e) { toast(esc(e.message), 'err'); }
  }
  if (st) st.textContent = '';
  toast(n ? `${plural(n)} adicionada${n > 1 ? 's' : ''}.` : 'Só imagens podem entrar na galeria.', n ? 'ok' : 'err');
}
A.galNova = async () => {
  const nome = await pedirTexto('Nova pasta', 'Nome da pasta', S.gm ? 'Mapas' : 'Minhas imagens', 'Criar'); if (!nome) return;
  const id = uid('gp');
  await D.set(cpath('pastas/' + id), { nome, dono: S.user.uname, doMestre: S.gm, visivel: S.gm ? false : true, colaborativa: false, tags: [], criadoEm: Date.now() });
  S.gal.pasta = id; render();
};
A.galAbrir = el => { S.gal.pasta = el.dataset.id; render(); window.scrollTo(0, 0); };
A.galVoltar = () => { S.gal.pasta = null; render(); };
const pastaAtual = () => S.pastas.find(x => x.id === S.gal.pasta);
CH.galNome = el => { const v = el.value.trim(); if (v) D.update(cpath('pastas/' + S.gal.pasta), { nome: v }); };
A.galVis = el => D.update(cpath('pastas/' + S.gal.pasta), { visivel: el.dataset.v === '1' });
A.galColab = () => { const p = pastaAtual(); D.update(cpath('pastas/' + p.id), { colaborativa: !p.colaborativa }); if (!p.colaborativa && !p.visivel) toast('Deixe a pasta visível para que outros possam colaborar.'); };
A.galDelPasta = async () => {
  const p = pastaAtual(); const imgs = galImgs(p.id);
  if (!await confirmar(`Excluir a pasta <b>${esc(p.nome)}</b> e ${plural(imgs.length)}? Isso não pode ser desfeito.`, 'Excluir pasta')) return;
  for (const i of imgs) { await Img.apagar(i.ref); await D.del(cpath('imagens/' + i.id)); }
  await D.del(cpath('pastas/' + p.id)); S.gal.pasta = null; render();
};
A.galFiltro = el => { const f = S.gal.filtro[S.gal.pasta] || (S.gal.filtro[S.gal.pasta] = []); const k = el.dataset.t; const i = f.indexOf(k); if (i >= 0) f.splice(i, 1); else f.push(k); render(); };
A.galFiltroLimpar = () => { S.gal.filtro[S.gal.pasta] = []; render(); };
A.galTagNova = () => {
  const p = pastaAtual(); const nome = $('#galTagNova').value.trim(); if (!nome) return;
  const tags = p.tags || []; if (tags.some(t => t.nome.toLowerCase() === nome.toLowerCase())) { toast('Essa tag já existe.'); return; }
  D.update(cpath('pastas/' + p.id), { tags: [...tags, { id: uid('t'), nome, cor: GAL_CORES[tags.length % GAL_CORES.length] }] });
};
A.galTagDel = async el => { const p = pastaAtual(); const t = (p.tags || []).find(x => x.id === el.dataset.t); if (!t || !await confirmar(`Excluir a tag <b>${esc(t.nome)}</b>?`, 'Excluir')) return; D.update(cpath('pastas/' + p.id), { tags: p.tags.filter(x => x.id !== t.id) }); };
A.galTagImg = el => {
  const p = pastaAtual(); const img = S.imagens.find(x => x.id === el.dataset.id); if (!img) return;
  const sel = new Set(img.tags || []);
  abrirModal(`<div class="gal-tags">${(p.tags || []).map(t => `<button class="gtag ${sel.has(t.id) ? 'on' : ''}" style="--tc:${t.cor}" data-tg="${t.id}" aria-pressed="${sel.has(t.id)}"><i></i>${esc(t.nome)}</button>`).join('')}</div><div class="modal-acoes"><button class="btn pri" id="tgOk">Aplicar</button></div>`, { titulo: 'Tags da imagem', cls: 'estreito' });
  $('#modal .gal-tags').onclick = e => { const b = e.target.closest('[data-tg]'); if (!b) return; const k = b.dataset.tg; sel.has(k) ? sel.delete(k) : sel.add(k); b.classList.toggle('on'); b.setAttribute('aria-pressed', sel.has(k)); };
  $('#tgOk').onclick = () => { D.update(cpath('imagens/' + img.id), { tags: [...sel] }); fecharModal(); };
};
CH.galLegenda = el => D.update(cpath('imagens/' + el.dataset.id), { legenda: el.value.slice(0, 80) });
A.galVer = el => { const i = S.imagens.find(x => x.id === el.dataset.id); if (i) abrirImagemGrande(i.ref, i.legenda); };
A.galMesa = async el => { const i = S.imagens.find(x => x.id === el.dataset.id); if (!i) return; await publicarNaMesa({ tipo: 'imagem', ref: i.ref, titulo: i.legenda || '' }); toast('Imagem mostrada à mesa.'); };
A.galDelImg = async el => { const i = S.imagens.find(x => x.id === el.dataset.id); if (!i || !await confirmar('Remover esta imagem da galeria?', 'Remover')) return; await Img.apagar(i.ref); await D.del(cpath('imagens/' + i.id)); };

/* apresentação com várias imagens */
A.galApresentar = () => {
  const pastas = S.pastas.filter(galVer); const ids = new Set(pastas.map(p => p.id));
  const imgs = S.imagens.filter(i => ids.has(i.pasta)); const sel = [];
  if (!imgs.length) { toast('Nenhuma imagem para apresentar ainda.'); return; }
  const des = () => {
    $('#apGrade').innerHTML = imgs.map(i => { const n = sel.indexOf(i.id); return `<button class="ap-it ${n >= 0 ? 'on' : ''}" data-ai="${i.id}" aria-pressed="${n >= 0}"><img src="${esc(Img.src(i.ref))}" alt="">${n >= 0 ? `<b class="ap-n">${n + 1}</b>` : ''}<small>${esc(i.legenda || '')}</small></button>`; }).join('');
    $('#apOk').disabled = !sel.length; $('#apOk').textContent = sel.length ? `Apresentar (${sel.length})` : 'Apresentar';
  };
  abrirModal(`<p class="dica">Escolha as imagens na ordem em que quer mostrar. A mesa recebe um convite no canto da tela.</p><div class="ap-grade" id="apGrade"></div><div class="modal-acoes"><button class="btn fant" data-a="fecharModal">Cancelar</button><button class="btn pri" id="apOk" disabled>Apresentar</button></div>`, { titulo: 'Apresentar à mesa', cls: 'largo' });
  $('#apGrade').onclick = e => { const b = e.target.closest('[data-ai]'); if (!b) return; const k = b.dataset.ai; const i = sel.indexOf(k); if (i >= 0) sel.splice(i, 1); else if (sel.length < 30) sel.push(k); des(); };
  $('#apOk').onclick = async () => { const lista = sel.map(k => imgs.find(i => i.id === k)).map(i => ({ ref: i.ref, legenda: i.legenda || '' })); await publicarNaMesa({ tipo: 'apresentacao', imagens: lista }); fecharModal(); toast('Apresentação enviada à mesa.'); };
  des();
};

</script>
</body>
