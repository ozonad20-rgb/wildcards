        <div><h3 class="tit-peq">Armas</h3>${ARMAS.map((a, i) => `<button class="eq-op ${f.armas.some(x => x.cat === 'a' + i) ? 'on' : ''}" data-a="wzEq" data-t="armas" data-i="${i}"><b>${a[0]}</b><small class="mono">${a[1]}${a[2] ? ' PA' + a[2] : ''} · $${a[5]}</small></button>`).join('')}</div>
        <div><h3 class="tit-peq">Armaduras</h3>${ARMADURAS.map((a, i) => `<button class="eq-op ${f.armaduras.some(x => x.cat === 'r' + i) ? 'on' : ''}" data-a="wzEq" data-t="armaduras" data-i="${i}"><b>${a[0]}</b><small class="mono">+${a[1]} · $${a[3]}</small></button>`).join('')}
          <h3 class="tit-peq">Itens</h3>${ITENS.map((a, i) => `<button class="eq-op ${f.itens.some(x => x.cat === 'i' + i) ? 'on' : ''}" data-a="wzEq" data-t="itens" data-i="${i}"><b>${a[0]}</b><small class="mono">$${a[1]}</small></button>`).join('')}</div>
      </div>`;
  } else {
    const d = deriv(f);
    const avisos = [];
    if (p.atrGasto !== p.atrTotal) avisos.push(`Atributos: ${p.atrGasto} de ${p.atrTotal} pontos.`);
    if (p.perGasto !== p.perTotal) avisos.push(`Perícias: ${p.perGasto} de ${p.perTotal} pontos.`);
    if (p.vantGasto !== p.vantTotal) avisos.push(`Vantagens: ${p.vantGasto} de ${p.vantTotal}.`);
    if (p.gastoComp > p.comp) avisos.push('Pontos de complicação gastos a mais.');
    if (!f.nome.trim()) avisos.push('Falta o nome.');
    corpo = `<div class="revisao">
      <div class="rev-id">${quadro(f.retrato, 'retrato', `<span class="ret-vazio">${esc((f.nome || '?')[0])}</span>`)}<div><h2>${esc(f.nome || 'Sem nome')}</h2><p>${esc(f.conceito)} · ${esc(f.raca)}</p></div></div>
      <div class="derivadas"><div class="dv"><b class="mono">${d.mov}</b><span>Movimentação</span></div><div class="dv"><b class="mono">${d.aparar}</b><span>Aparar</span></div><div class="dv"><b class="mono">${d.res}${d.arm ? `<small>(${d.arm})</small>` : ''}</b><span>Resistência</span></div><div class="dv"><b class="mono">${f.bennies}</b><span>Benes</span></div></div>
      <p><b>Atributos:</b> <span class="mono">${ATRIBUTOS.map(([k, , s]) => s + ' d' + f.atr[k].d).join(' · ')}</span></p>
      <p><b>Perícias:</b> ${PERICIAS.filter(([k]) => f.per[k]).map(([k, n]) => `${n} d${f.per[k].d}`).join(', ')}</p>
      <p><b>Vantagens:</b> ${f.vantagens.map(v => esc(v.nome)).join(', ') || '—'}</p>
      <p><b>Complicações:</b> ${f.complicacoes.map(c => `${esc(c.nome)} (${c.grav})`).join(', ') || '—'}</p>
      ${avisos.length ? `<div class="aviso"><b>Confira antes de criar:</b><ul>${avisos.map(a => `<li>${esc(a)}</li>`).join('')}</ul><p class="dica">Você pode criar mesmo assim e ajustar depois no modo de edição.</p></div>` : '<p class="ok-txt">Tudo certo. Pronto para entrar em ação!</p>'}
    </div>`;
  }
  return `<div class="wiz win">
    <div class="win-bar"><span class="win-tit">Assistente de criação · passo ${passo + 1}/${PASSOS.length}</span><button class="win-x" data-a="wzSair" aria-label="Fechar assistente">${ICO.x}</button></div>
    <ol class="wiz-passos">${PASSOS.map((n, i) => `<li class="${i === passo ? 'on' : i < passo ? 'feito' : ''}"><button data-a="wzIr" data-i="${i}" ${i > passo + 1 ? 'disabled' : ''}><span class="mono">${i + 1}</span>${n}</button></li>`).join('')}</ol>
    <div class="win-body"><h2 class="tit-sec">${PASSOS[passo]}</h2>${corpo}</div>
    <div class="wiz-pe"><button class="btn fant" data-a="wzIr" data-i="${passo - 1}" ${passo === 0 ? 'disabled' : ''}>‹ Voltar</button><span class="flex1"></span>
      ${passo < PASSOS.length - 1 ? `<button class="btn pri" data-a="wzIr" data-i="${passo + 1}">Próximo ›</button>` : `<button class="btn pri lg" data-a="wzCriar">Criar personagem</button>`}</div>
  </div>`;
}
function grupoWiz(chave) {
  const l = S.wiz.f[chave];
  if (!l.length) return '<p class="vazio">Nenhuma escolhida ainda.</p>';
  return `<div class="cartas-grade">${l.map((it, i) => `<div class="carta-slot"><div class="carta-btn">${cartaHtml(cartaDe(chave, it), { mini: true })}</div><div class="carta-acoes"><button class="btn ico sm fant" data-a="wzArte" data-k="${chave}" data-i="${i}" aria-label="Arte">${ICO.img}</button>${it.racial ? '<span class="chip mini">racial</span>' : `<button class="btn ico sm fant perigo-txt" data-a="wzTirar" data-k="${chave}" data-i="${i}" aria-label="Remover ${esc(it.nome)}">${ICO.lixo}</button>`}</div></div>`).join('')}</div>`;
}
document.addEventListener('input', ev => {
  const el = ev.target; if (!el.dataset.wz || !S.wiz) return;
  setPath(S.wiz.f, el.dataset.wz, el.dataset.num != null ? +el.value || 0 : el.value);
  if (el.dataset.wz === 'arcano.ppMax') S.wiz.f.arcano.pp = +el.value || 0;
  if (el.dataset.rr != null) softRender();
});
A.wzRaca = el => { const r = racasParaEscolha().find(x => x.id === el.dataset.id); aplicarRaca(S.wiz.f, r, { reset: true }); render(); };
A.wzIr = el => { const i = +el.dataset.i; if (i < 0 || i >= PASSOS.length) return; S.wiz.passo = i; render(); window.scrollTo(0, 0); };
A.wzSair = async () => { if (!await confirmar('Fechar o assistente? O personagem ainda não foi criado.', 'Fechar')) return; S.wiz = null; if (S.voltarPara) { S.tab = S.voltarPara; S.voltarPara = null; } render(); };
A.wzRetrato = async () => { const r = await ajustarImagem(S.wiz.f.retrato, { proporcao: '1/1', titulo: 'Retrato', max: 900 }); if (r !== undefined) S.wiz.f.retrato = r; render(); };
A.wzExtra = el => { const w = S.wiz; const k = el.dataset.k; w.extra[k] = Math.max(0, w.extra[k] + +el.dataset.d); render(); };
A.wzAtr = el => { const f = S.wiz.f; const k = el.dataset.k; f.atr[k].d = clamp(f.atr[k].d + +el.dataset.d, 4, 12); render(); };
A.wzPer = el => {
  const f = S.wiz.f; const k = el.dataset.k; const d = +el.dataset.d; const t = f.per[k];
  if (!t && d > 0) f.per[k] = T(4);
  else if (t) { const n = t.d + d; const b = wizBase(f).per(k); if (n < Math.max(4, b)) { if (!b) delete f.per[k]; } else t.d = clamp(n, 4, 12); }
  render();
};
A.wzAddCarta = el => {
  const k = el.dataset.k;
  abrirCatalogo(k, async x => {
    let g = null;
    if (k === 'complicacoes' && x[1] === 'menor/maior') { g = await escolherGravidade(x[0]); if (!g) return; }
    S.wiz.f[k].push(itemDoCatalogo(k, x, g));
    if (x[0] === 'Antecedente Arcano' && !S.wiz.f.arcano.ppMax) { S.wiz.f.arcano.ppMax = 10; S.wiz.f.arcano.pp = 10; }
    fecharModal(); render();
  }, { titulo: k === 'vantagens' ? 'Vantagens (Novato)' : k === 'complicacoes' ? 'Complicações' : 'Poderes', ficha: k === 'vantagens' ? S.wiz.f : null, filtro: k === 'vantagens' ? x => !/(Experiente|Veterano|Heroico|Lendário)/.test(x[2]) && !S.wiz.f.vantagens.some(v => v.nome === x[0]) : k === 'complicacoes' ? x => !S.wiz.f.complicacoes.some(c => c.nome === x[0]) : x => (x[5] || 'Novato') === 'Novato' && !S.wiz.f.poderes.some(p => p.nome === x[0]) });
};
A.wzTirar = el => { S.wiz.f[el.dataset.k].splice(+el.dataset.i, 1); render(); };
A.wzArte = async el => { const it = S.wiz.f[el.dataset.k][+el.dataset.i]; const r = await ajustarImagem(it.arte, { proporcao: '4/3', titulo: 'Arte: ' + it.nome, max: 900 }); if (r !== undefined) it.arte = r; render(); };
A.wzEq = el => {
  const f = S.wiz.f; const t = el.dataset.t, i = +el.dataset.i;
  const tag = (t === 'armas' ? 'a' : t === 'armaduras' ? 'r' : 'i') + i;
  const ex = f[t].findIndex(x => x.cat === tag);
  if (ex >= 0) f[t].splice(ex, 1);
  else if (t === 'armas') { const a = ARMAS[i]; f.armas.push({ id: uid('a'), cat: tag, nome: a[0], dano: a[1], pa: a[2], alcance: a[3], cdt: a[4], notas: a[6], custo: a[5], pericia: a[3] && a[1].startsWith('For') ? 'atletismo' : a[3] ? 'atirar' : 'lutar' }); }
  else if (t === 'armaduras') { const a = ARMADURAS[i]; f.armaduras.push({ id: uid('r'), cat: tag, nome: a[0], bonus: a[1], aparar: a[2] === 'Escudo' ? 2 : 0, area: a[2], notas: a[4], custo: a[3], usando: true }); }
  else { const a = ITENS[i]; f.itens.push({ id: uid('i'), cat: tag, nome: a[0], qtd: 1, notas: '', custo: a[1] }); }
  render();
};
A.wzCriar = async () => {
  const w = S.wiz; const f = clone(w.f); const p = wizPontos();
  if (!f.nome.trim()) f.nome = 'Novo personagem';
  const gasto = f.armas.reduce((s, a) => s + (a.custo || 0), 0) + f.armaduras.reduce((s, a) => s + (a.custo || 0), 0) + f.itens.reduce((s, a) => s + (a.custo || 0), 0);
  f.dinheiro = Math.max(0, p.dinheiroInicial - gasto);
  f.bennies = benesSessao(f);
  f.criadoEm = Date.now();
  const id = uid('f');
  await D.set(cpath('fichas/' + id), f);
  S.wiz = null; S.fichaAberta = id; S.voltarPara = null;
  toast(`<b>${esc(f.nome)}</b> está pronto para a ação!`, 'ok', 5000);
  render(); window.scrollTo(0, 0);
};

/* dano direto pela ficha (usa a mesma lógica do combate) */
function entradaDaFicha(f) {
  const en = typeof cbEntradas === 'function' ? cbEntradas(true).find(x => x.e.ref === 'pc:' + f.id) : null;
  return en || { id: 'ficha-' + f.id, e: {}, ficha: normFicha(f), tipo: 'pc', nome: f.nome || 'Sem nome', carta: null, lado: 'herois' };
}
A.fReceber = () => { const f = fichaAtual(); if (f) abrirReceberDano(entradaDaFicha(f)); };
A.fAbsorver = () => { const f = fichaAtual(); if (f) absorverDano(entradaDaFicha(f)); };
A.fBeneAbalado = async () => { const f = fU(); if (!f || !f.bennies) return; await salvarFichaCampo(f, { bennies: f.bennies - 1, abalado: false }); toast('Gastou um Bene e não está mais Abalado.', 'ok'); };

</script>
<script>
/* =====================================================================
   WILD CARD · Área do Mestre: código, capa, rolagem, fichas, NPCs,
   recompensas
   ===================================================================== */
'use strict';

S.gmRol = lsGet('wc.gmRol', { qtd: 1, lados: 6, explodir: true, selvagem: false, secreta: false, expr: '' });
S.rec = { sel: {}, valor: 5, motivo: '' };

function viewMestre() {
  if (S.npcAberto) { const n = S.npcs.find(x => x.id === S.npcAberto); if (n) return viewNpc(n); S.npcAberto = null; }
  const c = S.camp;
  const jogadores = (c.membros || []).filter(u => u !== c.mestre);
  const g = S.gmRol;

  const topo = `<div class="gm-topo">
    <section class="win cod-card"><div class="win-bar"><span class="win-tit">Código da campanha</span></div><div class="win-body">
      <button class="codigo-grande mono" data-a="copiarCodigo" title="Copiar código" aria-label="Copiar código ${esc(c.codigo)}">${esc(c.codigo)}<span>${ICO.copiar}</span></button>
      <p class="dica">Os jogadores usam este código em “Entrar em Campanha”.</p>
      <div class="membros"><span class="lbl">Na mesa (${jogadores.length})</span>${jogadores.map(u => `<span class="chip">${esc(nomeDe(u))}</span>`).join('') || '<span class="dica">Ninguém entrou ainda.</span>'}</div>
    </div></section>
    <section class="win capa-card"><div class="win-bar"><span class="win-tit">Capa</span></div><div class="win-body">
      <button class="capa-pick" data-a="capaCamp" data-id="${c.id}" aria-label="Trocar e ajustar a capa">${quadro(c.capa, 'capa', `<span class="capa-vazia">${ICO.img} Escolher capa 16:9</span>`)}<span class="ret-tag">Ajustar</span></button>
      <div class="linha-cfg"><label class="campo linha"><span>Nome</span><input class="inp" id="gmNome" data-c="gmNome" value="${esc(c.nome)}"></label>
      <label class="campo linha"><span>XP por avanço</span><input class="inp curto" type="number" min="1" max="50" id="gmXp" data-c="gmXp" value="${c.xpPorAvanco || 5}"></label></div>
    </div></section>
  </div>`;

  const rolagem = `<details class="box" data-k="gm.rol" ${aberto('gm.rol', true)}><summary class="box-h"><span>Rolagem</span><span class="box-res mono">${g.qtd}d${g.lados}</span></summary><div class="box-c">
    <div class="rol-gm">
      <div class="rol-dados" role="group" aria-label="Tipo de dado">${[4, 6, 8, 10, 12, 20, 100].map(l => `<button class="dado-b ${g.lados === l ? 'on' : ''}" data-a="gmLados" data-v="${l}" aria-pressed="${g.lados === l}">d${l}</button>`).join('')}</div>
      <div class="rol-linha">
        <div class="stepper grande"><button class="btn ico" data-a="gmQtd" data-d="-1" aria-label="Menos dados">${ICO.min}</button><span class="mono st-val">${g.qtd}</span><button class="btn ico" data-a="gmQtd" data-d="1" aria-label="Mais dados">${ICO.mais}</button></div>
        <button class="btn pri lg" data-a="gmRolar">${ICO.dado} Rolar ${g.qtd}d${g.lados}</button>
      </div>
      <form class="rol-linha" data-f="gmRolarExpr"><label class="campo flex1"><span>Ou digite uma expressão</span><input class="inp mono" id="gmExpr" value="${esc(g.expr)}" placeholder="ex.: 6d10, 1d20+3, 2d6+1d8"></label><button class="btn sec">Rolar</button></form>
      <div class="rol-opts">
        <label class="chk"><input type="checkbox" data-c="gmOpt" data-k="explodir" ${g.explodir ? 'checked' : ''}> Dados explodem (Savage)</label>
        <label class="chk"><input type="checkbox" data-c="gmOpt" data-k="selvagem" ${g.selvagem ? 'checked' : ''}> Teste com dado selvagem (1 dado + d6)</label>
        <label class="chk"><input type="checkbox" data-c="gmOpt" data-k="secreta" ${g.secreta ? 'checked' : ''}> Rolagem secreta (só o mestre vê)</label>
      </div>
    </div>
  </div></details>`;

  /* fichas de jogadores */
  const pcs = S.fichas.slice().sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));
  const fichas = `<details class="box" data-k="gm.fichas" ${aberto('gm.fichas', true)}><summary class="box-h"><span>Fichas dos jogadores</span><span class="box-res">${pcs.length}</span></summary><div class="box-c">
    <div class="add-linha"><label class="campo linha"><span>Criar para</span><select class="inp" id="gmDonoNova"><option value="-">Sem dono (guardar)</option>${jogadores.map(u => `<option value="${esc(u)}">${esc(nomeDe(u))}</option>`).join('')}<option value="${esc(S.user.uname)}">Eu (mestre)</option></select></label><button class="btn pri sm" data-a="gmCriarFicha">${ICO.mais} Criar ficha de jogador</button></div>
    <div class="lista-fichas">${pcs.map(f0 => {
    const f = normFicha(f0); const d = deriv(f);
    return `<div class="lf">
        <button class="lf-abrir" data-a="gmAbrirFicha" data-id="${f.id}">${quadro(f.retrato, 'retrato mini', `<span class="ret-vazio">${esc((f.nome || '?')[0])}</span>`)}<span><b>${esc(f.nome || 'Sem nome')}</b><small>${esc(f.conceito || '')} · ${d.posto} · XP ${f.xp || 0}${d.avDisp ? ` · <span class="txt-quente">${d.avDisp} avanço(s)</span>` : ''}</small></span></button>
        <span class="lf-stats mono">APA ${d.aparar} · RES ${d.res} · ★${f.bennies}${f.feridas ? ` · <span class="txt-perigo">${f.feridas}F</span>` : ''}</span>
        <label class="lf-dono"><span class="sr">Jogador</span><select class="inp" data-c="gmDono" data-id="${f.id}" aria-label="Jogador de ${esc(f.nome)}"><option value="-" ${!f.dono ? 'selected' : ''}>Sem dono</option>${[...jogadores, S.user.uname].map(u => `<option value="${esc(u)}" ${f.dono === u ? 'selected' : ''}>${esc(u === S.user.uname ? 'Mestre' : nomeDe(u))}</option>`).join('')}</select></label>
        <button class="btn ico fant perigo-txt" data-a="gmExcluirFicha" data-id="${f.id}" aria-label="Excluir ficha de ${esc(f.nome)}" title="Excluir">${ICO.lixo}</button>
      </div>`;
  }).join('') || '<p class="vazio">Nenhuma ficha ainda.</p>'}</div>
  </div></details>`;

  /* NPCs */
  const npcs = S.npcs.slice().sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));
  const npcBox = `<details class="box" data-k="gm.npcs" ${aberto('gm.npcs', true)}><summary class="box-h"><span>Fichas dos NPCs</span><span class="box-res">${npcs.length}</span></summary><div class="box-c">
    <div class="add-linha"><button class="btn pri sm" data-a="npcNovo">${ICO.mais} Novo NPC</button><select class="inp" id="npcModelo" aria-label="Modelo de NPC"><option value="">A partir de um modelo…</option>${NPC_MODELOS.map((m, i) => `<option value="${i}">${esc(m.nome)}</option>`).join('')}</select><button class="btn sec sm" data-a="npcDoModelo">Criar do modelo</button></div>
    <div class="npc-grade">${npcs.map(n => `<button class="npc-card" data-a="npcAbrir" data-id="${n.id}">${quadro(n.retrato, 'retrato mini', `<span class="ret-vazio">${esc((n.nome || '?')[0])}</span>`)}<span><b>${esc(n.nome || 'NPC')}</b><small>${n.carta === 'selvagem' ? '★ Carta Selvagem' : 'Extra'} · APA ${n.aparar} · RES ${n.res}${+n.arm ? `(${n.arm})` : ''}</small>${n.feridas || n.abalado ? `<small class="txt-perigo">${n.abalado ? 'Abalado ' : ''}${n.feridas ? n.feridas + ' ferim.' : ''}</small>` : ''}</span></button>`).join('') || '<p class="vazio">Nenhum NPC. Crie um ou use um modelo.</p>'}</div>
  </div></details>`;

  /* recompensas */
  const rec = S.rec;
  const recBox = `<details class="box" data-k="gm.rec" ${aberto('gm.rec', true)}><summary class="box-h"><span>Recompensas</span><span class="box-res">${xpPorAvanco()} XP = 1 avanço</span></summary><div class="box-c">
    ${pcs.length ? `<div class="rec-topo"><label class="campo linha"><span>XP para todos</span><input class="inp curto" type="number" id="recValor" value="${rec.valor}" data-c="recValor"></label><button class="btn fant sm" data-a="recTodos">Selecionar todos</button><button class="btn fant sm" data-a="recNenhum">Limpar seleção</button></div>
    <div class="rec-lista">${pcs.map(f => { const on = rec.sel[f.id] != null; return `<div class="rec-l ${on ? 'on' : ''}"><label class="chk"><input type="checkbox" data-c="recSel" data-id="${f.id}" ${on ? 'checked' : ''}> <b>${esc(f.nome || 'Sem nome')}</b> <small>${esc(nomeDe(f.dono))} · XP ${f.xp || 0}</small></label>${on ? `<input class="inp curto mono" type="number" id="recV_${f.id}" data-c="recValorFicha" data-id="${f.id}" value="${rec.sel[f.id]}" aria-label="XP para ${esc(f.nome)}">` : ''}</div>`; }).join('')}</div>
    <div class="add-linha"><input class="inp flex1" id="recMotivo" data-c="recMotivo" value="${esc(rec.motivo)}" placeholder="Motivo (opcional): ex.: salvaram o metrô"><button class="btn quente" data-a="recConceder" ${Object.keys(rec.sel).length ? '' : 'disabled'}>Conceder recompensa</button></div>` : '<p class="vazio">Crie fichas para dar recompensas.</p>'}
    <details class="sub" data-k="gm.hist" ${aberto('gm.hist', true)}><summary>Histórico (${S.recompensas.length})</summary>
      <ol class="rec-hist">${S.recompensas.map(r => `<li class="${r.revertida ? 'revertida' : ''}"><div><b>${r.itens.map(i => `${esc(i.nome)} +${i.xp}`).join(', ')}</b><small>${fmtData(r.ts)}${r.motivo ? ' · ' + esc(r.motivo) : ''}${r.revertida ? ' · revertida' : ''}</small></div>${!r.revertida ? `<button class="btn fant sm" data-a="recReverter" data-id="${r.id}">Reverter</button>` : ''}</li>`).join('') || '<li class="vazio">Nenhuma recompensa ainda.</li>'}</ol></details>
    <details class="sub" data-k="gm.ferr" ${aberto('gm.ferr')}><summary>Ferramentas de correção</summary>

A.recConceder = async () => {
  const sel = S.rec.sel; const itens = [];
  S.rec.motivo = ($('#recMotivo') || {}).value || S.rec.motivo;
  for (const [id, xp] of Object.entries(sel)) {
    const f = S.fichas.find(x => x.id === id); if (!f || !xp) continue;
    itens.push({ fichaId: id, nome: f.nome || 'Sem nome', xp: +xp });
  }
  if (!itens.length) { toast('Escolha as fichas e a quantidade de XP.'); return; }
  for (const it of itens) { const f = S.fichas.find(x => x.id === it.fichaId); await D.update(cpath('fichas/' + it.fichaId), { xp: (+f.xp || 0) + it.xp }); }
  await D.set(cpath('recompensas/' + uid('rc')), { ts: Date.now(), por: S.user.uname, itens, motivo: S.rec.motivo, revertida: false });
  S.rec = { sel: {}, valor: S.rec.valor, motivo: '' };
  toast(`Recompensa concedida a ${itens.length} ficha${itens.length > 1 ? 's' : ''}.`, 'ok');
  render();
};
A.recReverter = async el => {
  const r = S.recompensas.find(x => x.id === el.dataset.id); if (!r) return;
  if (!await confirmar(`Reverter esta recompensa? O XP sai das fichas: ${r.itens.map(i => `${esc(i.nome)} −${i.xp}`).join(', ')}.`, 'Reverter')) return;
  for (const it of r.itens) {
    const f = S.fichas.find(x => x.id === it.fichaId); if (!f) continue;
    const nv = Math.max(0, (+f.xp || 0) - it.xp);
    await D.update(cpath('fichas/' + f.id), { xp: nv });
    const gasto = (f.avancos || []).length * xpPorAvanco();
    if (nv < gasto) toast(`${esc(f.nome)} já tinha gasto esse XP em avanços. Confira a ficha.`, 'err', 6000);
  }
  await D.update(cpath('recompensas/' + r.id), { revertida: true, revertidaEm: Date.now() });
  toast('Recompensa revertida.');
};
A.resetarXp = async () => {

function novoNpc(base = {}) {
  return {
    tipo: 'npc', nome: 'Novo NPC', carta: 'extra', retrato: null,
    atr: { agi: 6, ast: 6, esp: 6, for: 6, vig: 6 }, per: 'Lutar d6, Perceber d6',
    mov: 6, aparar: 5, res: 5, arm: 0, ataques: [], habs: '', notas: '',
    feridas: 0, abalado: false, condicoes: [], bennies: 0, ...clone(base), criadoEm: Date.now(),
  };
}
function parsePer(txt) {
  const out = [];
  String(txt || '').split(/[,;\n]/).forEach(p => { const m = p.trim().match(/^(.+?)\s+d(\d+)(?:\s*([+-])\s*(\d+))?$/i); if (m) out.push({ nome: m[1].trim(), d: +m[2], b: m[3] ? (m[3] === '-' ? -m[4] : +m[4]) : 0 }); });
  return out;
}

function npcSecreto() { return !!S.gmRol.secreta; }
function rolarNpcTeste(n, nome, d, b = 0, extra = {}) {
  const pen = -Math.min(3, n.feridas || 0) - ((n.condicoes || []).some(k => ['distraido', 'atordoado', 'enredado', 'amarrado'].includes(k)) ? 2 : 0) - Math.min(2, n.fadiga || 0);
  const carta = cartaDoCombate('npc:' + n.id); const notas = [];
  let mod = pen + (extra.mod || 0); if (pen) notas.push('penalidades ' + fmtMod(pen));
  if (carta && carta.curinga) { mod += 2; notas.push('Curinga +2'); }
  if (extra.notas) notas.push(...extra.notas);
  return rolarTeste({ titulo: extra.titulo || nome, dado: d, bonus: b, mod, selvagem: n.carta === 'selvagem', personagem: n.nome, secreto: extra.secreto != null ? extra.secreto : npcSecreto(), notas, npcId: n.id, alvo: extra.alvo || 4, semBene: !!extra.semBene });
}

        <details class="box" data-k="n.atq" ${aberto('n.atq', true)}><summary class="box-h"><span>Ataques</span><span class="box-res">${n.ataques.length}</span></summary><div class="box-c">${ed
        ? `<div class="tab-ed">${n.ataques.map((a, i) => `<div class="te-l"><input class="inp" id="npAn${i}" data-alvo="npc" data-bind="ataques.${i}.nome" value="${esc(a.nome)}" aria-label="Nome do ataque"><input class="inp curto" id="npAp${i}" data-alvo="npc" data-bind="ataques.${i}.per" value="${esc(a.per)}" aria-label="Perícia (ex.: Lutar d8)"><input class="inp curto" id="npAd${i}" data-alvo="npc" data-bind="ataques.${i}.dano" value="${esc(a.dano)}" aria-label="Dano"><input class="inp mini-n" type="number" id="npAa${i}" data-alvo="npc" data-bind="ataques.${i}.pa" data-num value="${a.pa || 0}" aria-label="PA"><input class="inp curto" id="npAl${i}" data-alvo="npc" data-bind="ataques.${i}.alcance" value="${esc(a.alcance || '')}" placeholder="Alcance" aria-label="Alcance (ex.: 12/24/48)"><button class="btn ico sm fant perigo-txt" data-a="npcTirarAtaque" data-i="${i}" aria-label="Remover">${ICO.x}</button></div>`).join('')}<div class="add-linha"><button class="btn sec sm" data-a="npcAddAtaque">${ICO.mais} Ataque</button></div></div>`
        : `<div class="armas">${n.ataques.map((a, i) => `<div class="arma"><div class="arma-info"><b>${esc(a.nome)}</b><span class="mono">${esc(a.per)} · ${esc(a.dano)}${+a.pa ? ` · PA ${a.pa}` : ''}</span></div><div class="arma-bts"><button class="btn sm sec" data-a="npcAtacar" data-i="${i}">${ICO.espada} Atacar</button><button class="btn sm fant" data-a="npcDano" data-i="${i}">Dano</button><button class="btn sm fant" data-a="npcDano" data-i="${i}" data-amp="1">Dano +d6</button></div></div>`).join('') || '<p class="vazio">Sem ataques.</p>'}</div>`}</div></details>
        <details class="box" data-k="n.habs" ${aberto('n.habs', true)}><summary class="box-h"><span>Habilidades especiais</span></summary><div class="box-c">${ed ? `<textarea class="inp" id="npHabs" data-alvo="npc" data-bind="habs" rows="4">${esc(n.habs)}</textarea>` : `<p class="texto-livre">${esc(n.habs || '—')}</p>`}</div></details>
        <details class="box" data-k="n.notas" ${aberto('n.notas')}><summary class="box-h"><span>Notas do mestre</span></summary><div class="box-c"><textarea class="inp" id="npNotas" ${ed ? 'data-alvo="npc" data-bind="notas"' : 'data-c="npcNotas"'} rows="4">${esc(n.notas)}</textarea></div></details>
      </div>
    </div>
    ${ed ? `<div class="barra-salvar"><span>Mudanças ainda não salvas.</span><button class="btn fant" data-a="npcCancelar">Cancelar</button><button class="btn pri" data-a="npcSalvar">Salvar</button></div>` : ''}
  </div>`;
}

A.iniciarSessao = async () => {
  const jog = (S.camp.membros || []).filter(u => u !== S.camp.mestre).length;
  if (!await confirmar(`Iniciar uma nova sessão? Os Benes que sobraram são descartados: o mestre fica com ${jog}, cada personagem volta aos Benes de início de sessão e NPCs Carta Selvagem ficam com 2.`, 'Iniciar sessão', false)) return;
  await D.update(cpath(), { benesMestre: jog });
  for (const f of S.fichas) await D.update(cpath('fichas/' + f.id), { bennies: benesSessao(normFicha(f)) });
  for (const n of S.npcs.filter(n => n.carta === 'selvagem')) await D.update(cpath('npcs/' + n.id), { bennies: 2 });
  toast('Sessão iniciada. Benes distribuídos.', 'ok');
};

</script>
<script>
/* =====================================================================
   WILD CARD · Raças: o mestre cria raças com o sistema de habilidades
   raciais do livro e os jogadores as escolhem na criação da ficha
   ===================================================================== */
'use strict';

S.racas = [];
const racasVisiveis = () => S.racas.filter(r => S.gm || r.visivel !== false).sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));
/* raças disponíveis para a ficha: as da campanha ou, se não houver nenhuma, o Humano padrão */
function racasParaEscolha() {
  const l = racasVisiveis();
  return l.length ? l : [{ id: '__humano', nome: 'Humano', desc: 'Versáteis e adaptáveis.', habs: [H('adaptavel')] }];
}
function cartaRaca(r) {
  const pts = racaPontos(r);
  return { tipo: 'raca', nome: r.nome || 'Raça', linha: 'Raça · ' + (r.habs || []).length + ' habilidades', cor: '#1d1b18', req: '', desc: (r.desc ? r.desc + ' ' : '') + (r.habs || []).map(habRot).join('; ') + '.', arte: r.arte || null, nota: '', selo: (pts >= 0 ? '+' : '') + pts };
}

/* ---------- área do mestre ---------- */
function boxRacas() {
  const l = S.racas.slice().sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));
  return `<details class="box" data-k="gm.racas" ${aberto('gm.racas', true)}><summary class="box-h"><span>Raças</span><span class="box-res">${l.length} na campanha</span></summary><div class="box-c">
    <p class="dica">Crie raças com o sistema do livro: cada raça começa com +2 pontos de habilidades positivas; positivas extras são pagas com negativas. Os jogadores escolhem a raça no assistente de criação.</p>
    <div class="add-linha"><button class="btn pri sm" data-a="racaNova">${ICO.mais} Nova raça</button><button class="btn sec sm" data-a="racaImportar">Importar raças do livro</button></div>
    <div class="racas-lista">${l.map(r => { const p = racaPontos(r); const o = r.orcamento != null ? +r.orcamento : 2; return `<div class="raca-l">
      <button class="raca-abrir" data-a="racaEditar" data-id="${r.id}">${quadro(r.arte, 'retrato mini', `<span class="ret-vazio">${esc((r.nome || '?')[0])}</span>`)}<span><b>${esc(r.nome)}</b><small>${(r.habs || []).map(h => esc((HAB_RACIAIS[h.k] || {}).nome || h.k)).join(' · ')}</small></span></button>
      <span class="chip ${p === o ? '' : 'perigo'}" title="Pontos de habilidade (orçamento ${o})">${p >= 0 ? '+' : ''}${p} / ${o}</span>
      <button class="toggle sm ${r.visivel !== false ? 'on-ok' : ''}" data-a="racaVis" data-id="${r.id}" aria-pressed="${r.visivel !== false}" title="Jogadores podem escolher">${r.visivel !== false ? 'Disponível' : 'Oculta'}</button>
      <button class="btn ico sm fant perigo-txt" data-a="racaExcluir" data-id="${r.id}" aria-label="Excluir ${esc(r.nome)}">${ICO.lixo}</button></div>`; }).join('') || '<p class="vazio">Nenhuma raça criada. Sem raças, todo personagem é Humano (com uma Vantagem grátis).</p>'}</div>
  </div></details>`;
}
A.racaVis = el => { const r = S.racas.find(x => x.id === el.dataset.id); if (r) D.update(cpath('racas/' + r.id), { visivel: r.visivel === false }); };
A.racaExcluir = async el => { const r = S.racas.find(x => x.id === el.dataset.id); if (!r || !await confirmar(`Excluir a raça <b>${esc(r.nome)}</b>? Fichas que já usam continuam com uma cópia das habilidades.`, 'Excluir')) return; await D.del(cpath('racas/' + r.id)); };
A.racaImportar = () => {
  const ja = new Set(S.racas.map(r => (r.nome || '').toLowerCase()));
  abrirModal(`<p class="dica">Escolha as raças de exemplo do capítulo 1. Depois você pode editar cada uma.</p><div class="pilha">${RACAS_LIVRO.map((r, i) => `<label class="chk bloco"><input type="checkbox" value="${i}" ${ja.has(r.nome.toLowerCase()) ? 'disabled' : 'checked'}> <b>${esc(r.nome)}</b> <small>${r.habs.map(habRot).map(esc).join(' · ')}</small></label>`).join('')}</div>
    <div class="modal-acoes"><button class="btn fant" data-a="fecharModal">Cancelar</button><button class="btn pri" id="riOk">Importar</button></div>`, { titulo: 'Raças do livro', cls: 'largo' });
  $('#riOk').onclick = async () => {
    const sel = $$('#modal input:checked:not(:disabled)').map(i => RACAS_LIVRO[+i.value]);
    for (const r of sel) await D.set(cpath('racas/' + uid('rc')), { nome: r.nome, desc: r.desc, habs: clone(r.habs), orcamento: 2, visivel: true, arte: null, criadoEm: Date.now() });
    fecharModal(); toast(`${sel.length} raça(s) importada(s).`, 'ok');
  };
};
A.racaNova = () => editarRaca({ nome: 'Nova raça', desc: '', habs: [], orcamento: 2, visivel: true, arte: null });
A.racaEditar = el => { const r = S.racas.find(x => x.id === el.dataset.id); if (r) editarRaca(clone(r)); };

function alvoInput(h, i) {
  const d = HAB_RACIAIS[h.k];
  if (d.alvo === 'atr') return `<select class="inp" data-rh="${i}" data-campo="alvo" aria-label="Atributo"><option value="">Atributo…</option>${ATRIBUTOS.map(([k, n]) => `<option value="${k}" ${h.alvo === k ? 'selected' : ''}>${n}</option>`).join('')}</select>`;
  if (d.alvo === 'per') return `<select class="inp" data-rh="${i}" data-campo="alvo" aria-label="Perícia"><option value="">Perícia…</option>${PERICIAS.filter(p => h.k !== 'basicas_red' || p[3]).map(([k, n]) => `<option value="${k}" ${h.alvo === k ? 'selected' : ''}>${n}</option>`).join('')}</select>`;
  if (d.alvo === 'vant') return `<select class="inp" data-rh="${i}" data-campo="alvo" aria-label="Vantagem"><option value="">Vantagem…</option>${VANTAGENS.map(v => `<option ${h.alvo === v[0] ? 'selected' : ''}>${esc(v[0])}</option>`).join('')}</select>`;
  if (d.alvo === 'comp') return `<select class="inp" data-rh="${i}" data-campo="alvo" aria-label="Complicação"><option value="">Complicação…</option>${COMPLICACOES.map(v => `<option ${h.alvo === v[0] ? 'selected' : ''}>${esc(v[0])}</option>`).join('')}</select>`;
  if (d.alvo === 'poder') return `<select class="inp" data-rh="${i}" data-campo="alvo" aria-label="Poder"><option value="">Poder…</option>${PODERES.map(v => `<option ${h.alvo === v[0] ? 'selected' : ''}>${esc(v[0])}</option>`).join('')}</select>`;
  if (d.alvo === 'texto') return `<input class="inp" data-rh="${i}" data-campo="alvo" value="${esc(h.alvo || '')}" placeholder="Qual? (ex.: frio, venenos)" aria-label="Detalhe">`;
  return '';
}
function editarRaca(r) {
  const desenhar = () => {
    const pts = racaPontos(r); const orc = r.orcamento != null ? +r.orcamento : 2; const dif = pts - orc;
    const pos = Object.entries(HAB_RACIAIS).filter(([, d]) => !d.neg), neg = Object.entries(HAB_RACIAIS).filter(([, d]) => d.neg);
    const usados = k => r.habs.filter(h => h.k === k).length;
    $('#rcCorpo').innerHTML = `<div class="raca-ed">
      <div class="pilha">
        <label class="campo"><span>Nome</span><input class="inp" id="rcNome" value="${esc(r.nome)}"></label>
        <label class="campo"><span>Descrição</span><textarea class="inp" id="rcDesc" rows="3">${esc(r.desc || '')}</textarea></label>
        <div class="linha2"><label class="campo"><span>Orçamento de pontos</span><input class="inp mono" type="number" id="rcOrc" value="${orc}"></label><label class="chk"><input type="checkbox" id="rcVis" ${r.visivel !== false ? 'checked' : ''}> Disponível para os jogadores</label></div>
        <div class="campo"><span>Arte (aparece na carta da raça)</span><button type="button" class="ret-edit" id="rcArte">${quadro(r.arte, 'arte', `<span class="ret-vazio">${ICO.img}</span>`)}<span class="ret-tag">${r.arte ? 'Trocar' : 'Escolher'}</span></button></div>
      </div>
      <div class="pilha">
        <div class="raca-saldo ${dif === 0 ? 'ok' : dif > 0 ? 'over' : 'falta'}"><b class="mono">${pts >= 0 ? '+' : ''}${pts}</b><span>${dif === 0 ? 'Raça equilibrada' : dif > 0 ? `${dif} ponto${dif > 1 ? 's' : ''} acima do orçamento: some habilidades negativas` : `${-dif} ponto${dif < -1 ? 's' : ''} disponíve${dif < -1 ? 'is' : 'l'}`}</span></div>
        <div class="raca-habs">${r.habs.map((h, i) => { const d = HAB_RACIAIS[h.k]; const op = d.ops[h.op] || d.ops[0]; return `<div class="rh ${d.neg ? 'neg' : 'pos'}">
          <div class="rh-topo"><b>${esc(d.nome)}</b><span class="mono rh-v">${op.v > 0 ? '+' : ''}${op.v}</span><button type="button" class="btn ico sm fant perigo-txt" data-rx="${i}" aria-label="Remover ${esc(d.nome)}">${ICO.x}</button></div>
          <div class="rh-campos">${d.ops.length > 1 ? `<select class="inp" data-rh="${i}" data-campo="op" aria-label="Opção">${d.ops.map((o, k) => `<option value="${k}" ${h.op === k ? 'selected' : ''}>${o.v > 0 ? '+' : ''}${o.v} · ${esc(o.rot || '')}</option>`).join('')}</select>` : ''}${alvoInput(h, i)}<input class="inp" data-rh="${i}" data-campo="rotulo" value="${esc(h.rotulo || '')}" placeholder="Nome no cenário (opcional)" aria-label="Nome no cenário"></div>
          <small>${esc(d.desc)}</small></div>`; }).join('') || '<p class="vazio">Adicione habilidades abaixo.</p>'}</div>
        <div class="linha2"><label class="campo"><span>Adicionar positiva</span><select class="inp" id="rcAddPos"><option value="">Escolha…</option>${pos.map(([k, d]) => `<option value="${k}" ${usados(k) >= d.max ? 'disabled' : ''}>${esc(d.nome)} (${d.ops.map(o => '+' + o.v).join('/')})</option>`).join('')}</select></label>
        <label class="campo"><span>Adicionar negativa</span><select class="inp" id="rcAddNeg"><option value="">Escolha…</option>${neg.map(([k, d]) => `<option value="${k}" ${usados(k) >= d.max ? 'disabled' : ''}>${esc(d.nome)} (${d.ops.map(o => o.v).join('/')})</option>`).join('')}</select></label></div>
      </div></div>
      <div class="modal-acoes">${r.id ? '<button type="button" class="btn fant" id="rcDup">Duplicar</button>' : ''}<span class="flex1"></span><button type="button" class="btn fant" data-a="fecharModal">Cancelar</button><button type="button" class="btn pri" id="rcSalvar">Salvar raça</button></div>`;
    const sync = () => { r.nome = $('#rcNome').value; r.desc = $('#rcDesc').value; r.orcamento = +$('#rcOrc').value || 0; r.visivel = $('#rcVis').checked; };
    $('#rcOrc').oninput = () => { sync(); desenhar(); };
    $$('#rcCorpo [data-rh]').forEach(x => x.addEventListener(x.tagName === 'INPUT' ? 'input' : 'change', () => { sync(); const h = r.habs[+x.dataset.rh]; h[x.dataset.campo] = x.dataset.campo === 'op' ? +x.value : x.value; if (x.tagName !== 'INPUT') desenhar(); }));
    $$('#rcCorpo [data-rx]').forEach(x => { x.onclick = () => { sync(); r.habs.splice(+x.dataset.rx, 1); desenhar(); }; });
    const add = sel => { sync(); const k = sel.value; if (!k) return; r.habs.push({ k, op: 0, alvo: '', rotulo: '' }); desenhar(); };
    $('#rcAddPos').onchange = e => add(e.target); $('#rcAddNeg').onchange = e => add(e.target);
    $('#rcArte').onclick = async () => { sync(); const res = await ajustarImagem(r.arte, { proporcao: '4/3', titulo: 'Arte da raça', max: 900 }); if (res !== undefined) r.arte = res; editarRaca(r); };
    const dup = $('#rcDup'); if (dup) dup.onclick = () => { sync(); const c = clone(r); delete c.id; c.nome += ' (cópia)'; editarRaca(c); };
    $('#rcSalvar').onclick = async () => {
      sync();
      const falta = r.habs.find(h => HAB_RACIAIS[h.k].alvo && !h.alvo);
      if (falta) { toast(`Escolha o detalhe de “${esc(HAB_RACIAIS[falta.k].nome)}”.`, 'err'); return; }
      if (!r.nome.trim()) { toast('Dê um nome à raça.', 'err'); return; }
      const id = r.id || uid('rc'); const d = { ...r }; delete d.id; if (!d.criadoEm) d.criadoEm = Date.now();
      await D.set(cpath('racas/' + id), d); fecharModal();
      const p = racaPontos(r); toast(p === (r.orcamento != null ? +r.orcamento : 2) ? `Raça “${esc(r.nome)}” salva.` : `Raça “${esc(r.nome)}” salva fora do orçamento (${p >= 0 ? '+' : ''}${p}).`, 'ok');
    };
  };
  abrirModal('<div id="rcCorpo"></div>', { titulo: r.id ? 'Editar raça' : 'Nova raça', cls: 'largo' });
  desenhar();
}

/* ---------- aplicar raça à ficha ---------- */
function snapshotRaca(r) { return r ? { nome: r.nome, desc: r.desc || '', habs: clone(r.habs || []), arte: r.arte || null } : null; }
/* aplica os efeitos de criação: dados iniciais, cartas e armas naturais.
   reset=true (assistente) refaz atributos e perícias a partir da raça. */
function aplicarRaca(f, r, { reset = false } = {}) {
  const ant = f.racaDados ? racaEf(f.racaDados) : null;
  f.racaId = r && r.id !== '__humano' ? r.id : null; f.raca = r ? r.nome : ''; f.racaDados = snapshotRaca(r);
  const e = racaEf(r);
  if (reset) {
    ATRIBUTOS.forEach(([k]) => { f.atr[k] = T(passoDado(4, e.atrIni[k] || 0)); });
    f.per = {}; PERICIAS_BASICAS.forEach(k => { if (!e.semBasicas.includes(k)) f.per[k] = T(4); });
    for (const [k, d] of Object.entries(e.perIni)) f.per[k] = T(Math.max(d, (f.per[k] || {}).d || 0));
  }
  /* tira o que veio da raça anterior e põe o da nova */
  f.vantagens = (f.vantagens || []).filter(x => !x.racial);
  f.complicacoes = (f.complicacoes || []).filter(x => !x.racial);
  f.poderes = (f.poderes || []).filter(x => !x.racial);
  f.armas = (f.armas || []).filter(x => !x.racial);
  e.vantagens.forEach(n => { const x = VANTAGENS.find(v => v[0] === n); const it = x ? itemDoCatalogo('vantagens', x) : { id: uid('v'), nome: n, cat: 'antecedente', req: '', desc: '' }; it.racial = true; it.nota = 'Habilidade racial'; f.vantagens.push(it); });
  e.complicacoes.forEach(c => { const x = COMPLICACOES.find(v => v[0] === c.nome); const it = x ? itemDoCatalogo('complicacoes', x, c.grav) : { id: uid('c'), nome: c.nome, grav: c.grav, desc: '' }; it.racial = true; it.nota = 'Habilidade racial'; f.complicacoes.push(it); });
  e.poderes.forEach(n => { const x = PODERES.find(v => v[0] === n); if (!x) return; const it = itemDoCatalogo('poderes', x); it.racial = true; it.nota = 'Poder inato da raça'; f.poderes.push(it); });
  if (e.poderes.length && !f.arcano.tipo) { f.arcano = { ...f.arcano, tipo: 'Dom (racial)', pericia: f.arcano.pericia || 'foco', ppMax: f.arcano.ppMax || 15, pp: f.arcano.pp || 15 }; }
  e.armas.forEach(a => f.armas.push({ id: uid('a'), nome: a.nome, dano: a.dano, pa: a.pa, alcance: '', cdt: '1', notas: 'Arma Natural (raça)', pericia: 'lutar', racial: true }));
  return f;
}

/* ---------- seção na ficha ---------- */
function secaoRaca(f, src, ed) {
  const r = racaDaFicha(src);
  const opts = racasParaEscolha();
  const carta = r ? cartaRaca(r) : null;
  return `<details class="box" data-k="f.raca" ${aberto('f.raca', true)}><summary class="box-h"><span>Raça</span><span class="box-res">${esc(src.raca || '—')}</span></summary><div class="box-c">
    ${ed ? `<div class="add-linha"><select class="inp" id="edRacaSel" aria-label="Raça"><option value="">Sem raça definida</option>${opts.map(x => `<option value="${x.id}" ${src.racaId === x.id || (!src.racaId && src.raca === x.nome) ? 'selected' : ''}>${esc(x.nome)}</option>`).join('')}</select><button class="btn sm sec" data-a="edAplicarRaca">Aplicar raça</button></div>
      <p class="dica">Aplicar troca as habilidades raciais da ficha: cartas de vantagem e complicação raciais, poderes inatos e armas naturais. Atributos e perícias não mudam.</p>` : ''}
    ${r ? `<div class="raca-ficha"><button class="carta-btn" data-a="verRaca" aria-label="Ampliar raça">${cartaHtml(carta, { mini: true })}</button>
      <ul class="raca-habs-lista">${(r.habs || []).map(h => `<li><b>${esc(habRot(h))}</b><small>${esc((HAB_RACIAIS[h.k] || {}).desc || '')}</small></li>`).join('')}</ul></div>` : '<p class="vazio">Sem habilidades raciais.</p>'}
  </div></details>`;
}
A.verRaca = () => { const f = fichaAtual(); if (!f) return; const r = racaDaFicha(S.edicao || f); if (r) abrirCartaGrande(cartaRaca(r), f.nome); };
A.edAplicarRaca = () => {
  const id = $('#edRacaSel').value; const r = racasParaEscolha().find(x => x.id === id) || null;
  aplicarRaca(S.edicao, r); render(); toast(r ? `Raça ${esc(r.nome)} aplicada. Salve a edição para confirmar.` : 'Raça removida da ficha.');
};

</script>
<script>
/* =====================================================================
   WILD CARD · ajudante de ataque: escolhe o alvo, calcula os
   modificadores (distância, luz, agrupar, cobertura…), rola o ataque,
   rola o dano e aplica no alvo
   ===================================================================== */
'use strict';

function armaDoAtacante(en, i) {
  if (i < 0 || !en.ficha) return { nome: 'Ataque', dano: '2d6', pa: 0, alcance: '', distancia: false };
  if (en.tipo === 'pc') {
    const a = en.ficha.armas[i]; const per = a.pericia || (a.alcance ? 'atirar' : 'lutar');
    return { nome: a.nome, dano: a.dano, pa: +a.pa || 0, alcance: a.alcance || '', per, distancia: per !== 'lutar' };
  }
  const a = en.ficha.ataques[i]; const p = parsePer(a.per)[0] || { nome: 'Lutar', d: 6, b: 0 };
  const dist = !!a.alcance || /atirar|arremess|atletismo/i.test(p.nome);

}
function faixaDist(alc, d) {
  const m = String(alc || '').match(/(\d+)\s*\/\s*(\d+)\s*\/\s*(\d+)/); if (!m || d == null) return null;
  const [c, me, l] = [+m[1], +m[2], +m[3]];
  if (d <= c) return [0, 'Curta']; if (d <= me) return [-2, 'Média']; if (d <= l) return [-4, 'Longa']; if (d <= l * 4) return [-8, 'Extrema']; return [null, 'Fora de alcance'];
}
/* agrupar: inimigos do alvo adjacentes a ele (além do atacante), menos aliados do alvo adjacentes */
function agruparAuto(at, alvo) {

  const ents = cbEntradas(true).filter(x => !cbFora(x) && !cbInfo(x).conds.includes('atordoado'));

  const atacantes = ents.filter(x => x.lado !== alvo.lado && adj(x) && x.id !== at.id).length;
  const defensores = ents.filter(x => x.lado === alvo.lado && x.id !== alvo.id && adj(x) && bmDist(x.id, at.id) <= 1).length;
  let b = clamp(atacantes - defensores, 0, 4);
  const v = cbInfo(alvo).v || new Set();
  if (v.has('Bloquear Aprimorado')) b = Math.max(0, b - 2); else if (v.has('Bloquear')) b = Math.max(0, b - 1);
  return b;
}

A.atqAbrir = el => {
  const at = cbEn(el.dataset.id); if (!at) return;
  const arma = armaDoAtacante(at, +el.dataset.i);
  const alvos = cbEntradas().filter(x => x.id !== at.id && !cbFora(x));

  const bonusPc = armaPc ? bonusAtaquePc(at.ficha, armaPc, arma.per) : [];

        if (st.selvagem) mods.push(['Ataque Selvagem', 2]);
      } else {

        if (fx) { if (fx[0] == null) mods.push(['Fora de alcance', 0, true]); else if (fx[0]) mods.push([`Distância ${fx[1]} (${dist} quadros)`, fx[0]]); }
        if (iA.v && iA.v.has('Esquiva')) mods.push(['Alvo com Esquiva', -2]);
        if (iA.conds.includes('caido') && dist != null && dist > 3) mods.push(['Alvo caído a mais de 3 quadros', -4]);
        if (st.mirar) mods.push(['Mirar', 2]);
      }
      if (iA.v && iA.v.has('Combatente Acrobata')) mods.push(['Alvo Combatente Acrobata', -1]);
      if (iA.conds.includes('amarrado')) mods.push(['Finalização (alvo amarrado/indefeso)', 4]);
      else if (iA.conds.includes('vulneravel') || iA.conds.includes('atordoado')) mods.push([iA.conds.includes('atordoado') ? 'Alvo Atordoado (Vulnerável)' : 'Alvo Vulnerável', 2]);
    }

    if (st.cobertura) mods.push(['Cobertura', st.cobertura]);
    const pl = penLuz({ visao: infoAt.visao }); if (pl) mods.push(['Iluminação', pl]);
    if (st.livre) mods.push(['Outros', st.livre]);
    const somaMods = mods.reduce((s, m) => s + (m[1] || 0), 0);
    st._mods = mods; st._tn = tn; st._soma = somaMods;
    const verTn = S.gm || (alvo && alvo.tipo === 'pc');
    let corpo = `<div class="atq-topo"><div><span class="lbl">Atacante</span><b>${esc(at.nome)}</b></div><div><span class="lbl">Arma</span><b>${esc(arma.nome)}</b> <span class="mono">${esc(arma.dano)}${arma.pa ? ' PA' + arma.pa : ''}${arma.alcance ? ' · ' + esc(arma.alcance) : ''}</span></div></div>`;
    if (st.fase === 'ataque') {
      corpo += `<label class="campo"><span>Alvo</span><select class="inp" id="atqAlvo">${alvos.length ? '' : '<option value="">Sem alvo (Dificuldade 4)</option>'}${alvos.map(x => `<option value="${x.id}" ${x.id === st.alvo ? 'selected' : ''}>${esc(x.nome)}${x.lado === at.lado ? ' (aliado)' : ''}</option>`).join('')}<option value="" ${!st.alvo ? 'selected' : ''}>Sem alvo (Dificuldade 4)</option></select></label>
        <div class="atq-ops">
          ${arma.distancia ? `<label class="chk"><input type="checkbox" id="atqMirar" ${st.mirar ? 'checked' : ''}> Mirou no turno anterior (+2)</label>` : `<label class="chk"><input type="checkbox" id="atqSelv" ${st.selvagem ? 'checked' : ''}> Ataque Selvagem (+2 no ataque e dano; fica Vulnerável)</label>`}
          <label class="campo linha"><span>Cobertura</span><select class="inp" id="atqCob">${[[0, 'Nenhuma'], [-2, 'Leve −2'], [-4, 'Média −4'], [-6, 'Pesada −6'], [-8, 'Quase total −8']].map(([v, n]) => `<option value="${v}" ${st.cobertura === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label>

    }

    const lig = (id, fn) => { const x = $('#' + id); if (x) x.addEventListener(x.type === 'checkbox' || x.tagName === 'SELECT' ? 'change' : 'input', fn); };
    lig('atqAlvo', e => { st.alvo = e.target.value; st.agrupar = null; desenhar(); });
    lig('atqSelv', e => { st.selvagem = e.target.checked; desenhar(); });

    lig('atqAg', e => { st.agrupar = clamp(+e.target.value || 0, 0, 4); desenhar(); });
    lig('atqLivre', e => { st.livre = +e.target.value || 0; desenhar(); });

    const bd = $('#atqDano'); if (bd) bd.onclick = () => rolarDanoAtq();
    const ba = $('#atqAplicar'); if (ba) ba.onclick = async () => { await aplicarDano(alvo, st.calc, at.nome + ' · ' + arma.nome); fecharModal(); toast(`${esc(alvo.nome)}: ${esc(st.calc.txt)}`, st.calc.fer ? 'err' : ''); };
    const bb = $('#atqBene'); if (bb) bb.onclick = async () => { if (await gastarBeneDe(at)) rolarAtq(true); };
    const bdb = $('#atqDanoBene'); if (bdb) bdb.onclick = async () => { if (await gastarBeneDe(at)) rolarDanoAtq(true); };
  };
  const rolarAtq = async (reroll = false) => {
    const alvo = alvos.find(x => x.id === st.alvo);
    const notas = st._mods.filter(m => m[1]).map(m => `${m[0]} ${fmtMod(m[1])}`);
    if (alvo) notas.unshift('contra ' + alvo.nome);
    const titulo = 'Ataque: ' + arma.nome + (reroll ? ' (Bene)' : '');

      const cfg = montarTeste(at.ficha, 'per', arma.per, { titulo, mod: st._soma + mb + extraImp, notas: [...nb, ...notas, extraImp ? 'Impulso +2' : ''], alvo: st._tn });
      cfg.semBene = true; cfg.secreto = false;
      r = await rolarTeste(cfg);
    } else if (at.tipo === 'npc') {
      r = await rolarNpcTeste(at.ficha, arma.npcPer.nome, arma.npcPer.d, arma.npcPer.b, { titulo, mod: st._soma, notas, alvo: st._tn, semBene: true, secreto: !!at.e.oculto || npcSecreto() });
    } else {
      r = await rolarTeste({ titulo, dado: 6, bonus: 0, mod: st._soma, selvagem: false, personagem: at.nome, notas, alvo: st._tn, semBene: true, secreto: true });
    }
    if (reroll && st.res && st.res.final > r.res.final) { toast(`Nova rolagem ${r.res.final}: fica a anterior (${st.res.final}), a melhor das duas.`); }
    else st.res = r.res;

      if (v.has('Assassino') && (fin || cA.includes('vulneravel') || cA.includes('atordoado'))) { expr += '+2'; notas.push('Assassino +2'); }
      if (alvo && v.has('Matador de Gigantes') && (cbInfo(alvo).tam || 0) >= (infoAt.tam || 0) + 3) { expr += '+d6'; notas.push('Matador de Gigantes +d6'); }
      if (reroll && v.has('Impiedoso')) { expr += '+2'; notas.push('Impiedoso +2'); }
      if (carta && carta.curinga && !reroll) { if (!arma.distancia && v.has('Golpe Poderoso')) dobra = 'Golpe Poderoso'; else if (arma.distancia && v.has('Tiro Mortal')) dobra = 'Tiro Mortal'; }
    }
    const forca = at.tipo === 'pc' ? at.ficha.atr.for : T(+((at.ficha && at.ficha.atr && at.ficha.atr.for) || 6));
    try {
      const r = await rolarExpressao('Dano: ' + arma.nome, expr, { for: forca }, { personagem: at.nome, fichaId: at.tipo === 'pc' ? at.ficha.id : null, nota: [alvo ? 'em ' + alvo.nome : '', ...notas, arma.pa ? 'PA ' + arma.pa : ''].filter(Boolean).join(' · '), secreto: at.tipo !== 'pc' && (!!at.e.oculto || npcSecreto()) });
      let total = r.total;
      if (dobra) { total *= 2; notas.push(`${dobra}: dano dobrado (${r.total} × 2)`); toast(`${dobra}: Curinga na mão, dano dobrado para <b>${total}</b>.`); }
      if (reroll && st.dano && st.dano.total > total) { toast(`Novo dano ${total}: fica o anterior (${st.dano.total}).`); total = st.dano.total; }
      st.dano = { ...r, total }; st.danoNotas = notas; st.danoBene = reroll; st.calc = alvo ? calcDano(cbInfo(alvo), total, arma.pa) : null;
      desenhar();
    } catch (e) { toast(esc(e.message), 'err'); }
  };
  abrirModal('<div id="atqCorpo" class="atq"></div>', { titulo: 'Atacar', cls: '' });
  desenhar();
};
function benesDe(en) { const i = cbInfo(en); return en.tipo === 'pc' ? i.bennies : en.tipo === 'npc' && S.gm ? i.bennies + ((S.camp && S.camp.benesMestre) || 0) : 0; }
async function gastarBeneDe(en) {

  if (en.tipo === 'pc') { if (!i.bennies) return false; await salvarFichaCampo(en.ficha, { bennies: i.bennies - 1 }); return true; }
  if (en.tipo === 'npc') {
    if (i.bennies) { await npcPatch(en.ficha.id, { bennies: i.bennies - 1 }); return true; }
    if ((S.camp.benesMestre || 0) > 0) { await D.update(cpath(), { benesMestre: S.camp.benesMestre - 1 }); return true; }

}

<script>

'use strict';

const LUZES = [[0, 'Clara', ''], [2, 'Penumbra', 'crepúsculo, neblina leve, lua cheia'], [4, 'Escuridão', 'noite com pouca luz; alvos invisíveis além de 10 quadros'], [6, 'Escuro como Breu', 'escuridão total']];

  nevasca: { nome: 'Nevasca', dica: 'Frio abaixo de 0 °C: Vigor a cada 4 horas, −2 a cada 5 °C abaixo (máx. −4). Falha: um nível de Fadiga.' },
  calor: { nome: 'Calor extremo', dica: 'Acima de 32 °C: Vigor a cada 4 horas (−1 ou −2 se extremo ou com esforço). Falha: Fadiga.' },
  vento: { nome: 'Vendaval', dica: 'Ventos fortes: sugira −2 em ataques a distância e Atletismo para se manter de pé.' },

/* participantes resolvidos com suas fichas */
function cbEntradas(todas = false) {
  const cb = cbEstado(); const out = [];
  for (const [id, e] of Object.entries(cb.entradas || {})) {

}
const cbPode = en => S.gm || (en.tipo === 'pc' && en.ficha && en.ficha.dono === S.user.uname);

    return { aparar: d.aparar, res: d.res, arm: d.arm, resBase: d.resBase, mov: d.mov, feridas: en.ficha.feridas || 0, maxF: d.maxFer, abalado: !!en.ficha.abalado, conds: en.ficha.condicoes || [], bennies: en.ficha.bennies || 0, selvagem: en.ficha.carta !== 'extra', fadiga: en.ficha.fadiga || 0, tam: d.tam, visao: d.re.visao, robusto: d.re.robusto, construto: d.re.construto, v: d.v };

      visao: npcTem(n, 'vis[ãa]o no escuro') ? 'escuro' : npcTem(n, 'infravis') ? 'infra' : null, robusto: npcTem(n, 'robusto'), construto: npcTem(n, 'construto'), v: new Set(String(n.habs || '').split(/[.,;\n]\s*/).map(x => x.trim())) };
  }

}

}
function benesSessao(f) {
  const v = new Set((f.vantagens || []).map(x => nomeLivro(x.nome))); const c = {}; (f.complicacoes || []).forEach(x => { c[nomeLivro(x.nome)] = x.grav; });
  let n = +f.benniesBase || 3;
  if (v.has('Sorte Grande')) n += 2; else if (v.has('Sorte')) n += 1;
  if (c['Má Sorte']) n -= 1; if (c['Jovem']) n += c['Jovem'] === 'maior' ? 2 : 1;

}

/* atualiza o estado de qualquer participante (ficha, NPC ou avulso) */
async function cbPatchEnt(en, patch) {
  if (en.tipo === 'pc') return salvarFichaCampo(en.ficha, patch);
  if (en.tipo === 'npc') return npcPatch(en.ficha.id, patch);
  const a = { ...(en.e.avulso || {}) };
  if ('feridas' in patch) a.feridas = patch.feridas; if ('abalado' in patch) a.abalado = patch.abalado; if ('condicoes' in patch) a.conds = patch.condicoes;
  return cbSalvar({ entradas: { [en.id]: { avulso: a } } });
}
const cbEn = id => cbEntradas(true).find(x => x.id === id);
A.cbPip = el => { const en = cbEn(el.dataset.id); if (!en) return; const i = +el.dataset.i; const at = cbInfo(en).feridas; cbPatchEnt(en, { feridas: at >= i ? i - 1 : i }); };
A.cbAbalado = el => { const en = cbEn(el.dataset.id); if (en) cbPatchEnt(en, { abalado: !cbInfo(en).abalado }); };
A.cbCondTirar = el => { const en = cbEn(el.dataset.id); if (en) cbPatchEnt(en, { condicoes: cbInfo(en).conds.filter(c => c !== el.dataset.k) }); };
CH.cbCondAdd = el => { const en = cbEn(el.dataset.id); if (en && el.value) cbPatchEnt(en, { condicoes: [...new Set([...cbInfo(en).conds, el.value])] }); };
A.cbDefender = el => { const en = cbEn(el.dataset.id); if (!en) return; const c = cbInfo(en).conds; cbPatchEnt(en, { condicoes: c.includes('defendendo') ? c.filter(x => x !== 'defendendo') : [...c, 'defendendo'] }); };

A.cbPer = el => { const en = cbEn(el.dataset.id); if (en) rolarDaFicha(en.ficha, 'per', el.dataset.k); };

A.cbBeneAbalado = async el => {

  else if (en.tipo === 'npc') { if (i.bennies) await npcPatch(en.ficha.id, { bennies: i.bennies - 1, abalado: false }); else if ((S.camp.benesMestre || 0) > 0) { await D.update(cpath(), { benesMestre: S.camp.benesMestre - 1 }); await npcPatch(en.ficha.id, { abalado: false }); } else return toast('Sem Benes.'); }

/* recuperação de Abalado (Espírito) e Atordoado (Vigor) */
async function rolarRecuperacao(en, silencioso = false) {
  const i = cbInfo(en);
  const atord = i.conds.includes('atordoado');
  if (!atord && !i.abalado) return;
  const atr = atord ? 'vig' : 'esp';
  let mod = 0; const notas = [];
  if (i.v && i.v.has('Reflexos de Combate')) { mod += 2; notas.push('Reflexos de Combate +2'); }
  if (i.construto && !atord) { mod += 2; notas.push('Construto +2'); }
  const titulo = atord ? 'Recuperar de Atordoado' : 'Recuperar de Abalado';
  let r;
  if (en.tipo === 'pc') r = await rolarTeste(montarTeste(en.ficha, 'atr', atr, { titulo, mod, notas }));
  else if (en.tipo === 'npc') r = await rolarNpcTeste(en.ficha, ATR_NOME[atr], +en.ficha.atr[atr] || 4, 0, { titulo, mod, notas });
  else return;
  const { res } = r;
  if (atord) {
    if (res.sucesso) {
      const conds = i.conds.filter(c => c !== 'atordoado' && c !== 'caido');
      if (!res.amp) conds.push('distraido', 'vulneravel');
      await cbPatchEnt(en, { condicoes: [...new Set(conds)] });
      toast(`${esc(en.nome)} se recuperou do Atordoamento${res.amp ? '' : ' (fica Distraído e Vulnerável)'}.`, 'ok');
    } else if (!silencioso) toast(`${esc(en.nome)} continua Atordoado.`, 'err');
  } else if (res.sucesso) { await cbPatchEnt(en, { abalado: false }); toast(`${esc(en.nome)} se recuperou de Abalado e pode agir.`, 'ok'); }
  else if (!silencioso) toast(`${esc(en.nome)} continua Abalado. Gaste um Bene para sair agora.`, 'err');
}
A.cbRecuperar = el => { const en = cbEn(el.dataset.id); if (en) rolarRecuperacao(en); };

/* ---------- dano: calcula e aplica ---------- */
function calcDano(i, dano, pa = 0) {
  const res = i.resBase + Math.max(0, i.arm - Math.max(0, pa));
  let fer = 0, aba = i.abalado, txt;
  if (dano < res) txt = 'Sem efeito.';
  else {
    const amp = Math.floor((dano - res) / 4);
    if (amp === 0) { if (i.abalado && !i.robusto) { fer = 1; txt = 'Já Abalado: sofre 1 Ferimento.'; } else txt = i.abalado ? 'Já Abalado (Robusto: sem Ferimento).' : 'Fica Abalado.'; }
    else { fer = amp; txt = `${amp} Ferimento${amp > 1 ? 's' : ''} e Abalado.`; }
    aba = true;
  }
  const total = i.feridas + fer;
  const fora = fer > 0 && total > i.maxF;
  if (fora) txt += i.maxF ? ' Fica Incapacitado!' : ' O Extra está fora de combate.';
  return { res, fer, aba, total, fora, txt };
}
async function aplicarDano(en, calc, origem = '') {
  const i = cbInfo(en); const conds = i.conds.slice();
  if (calc.fora && !conds.includes('incapacitado')) conds.push('incapacitado');
  await cbPatchEnt(en, { feridas: Math.min(calc.total, i.maxF + 1), abalado: calc.aba, condicoes: conds });
  if (calc.fer && (cbEstado().entradas || {})[en.id]) await cbSalvar({ ultimoDano: { id: en.id, fer: calc.fer, ts: Date.now() } });
  registrarRolagem({ tipo: 'expr', ts: Date.now(), autor: S.user.uname, personagem: en.nome, titulo: 'Dano recebido' + (origem ? ' · ' + origem : ''), partes: [], final: calc.fer ? `${calc.fer} ferim.` : calc.aba ? 'Abalado' : '—', resumo: calc.txt, nivel: calc.fer ? 'critico' : 'dano', nota: calc.txt, secreto: en.tipo !== 'pc' && !!en.e.oculto });
}
A.cbReceber = el => { const en = cbEn(el.dataset.id); if (en) abrirReceberDano(en); };
function abrirReceberDano(en) {

  abrirModal(`<form id="rdF" class="pilha">

    <p class="dica">Resistência de ${esc(en.nome)}: <b class="mono">${i.res}</b>${i.arm ? ` (armadura ${i.arm}; a PA reduz até ${i.arm})` : ''}. ${i.abalado ? 'Já está Abalado.' : ''}</p>
    <div id="rdRes" class="rd-res" aria-live="polite"></div>
    <div class="modal-acoes"><button type="button" class="btn fant" data-a="fecharModal">Cancelar</button><button class="btn perigo" id="rdOk" disabled>Aplicar</button></div></form>`, { titulo: 'Receber dano', cls: 'estreito' });
  let calc = null;
  const atual = () => {

  $('#rdF').onsubmit = async e => { e.preventDefault(); if (!calc) return; await aplicarDano(en, calc); fecharModal(); toast(`${esc(en.nome)}: ${esc(calc.txt)}`, calc.fer ? 'err' : ''); };
}
/* absorver dano: Bene + Vigor */
A.cbAbsorver = el => { const en = cbEn(el.dataset.id); if (en) absorverDano(en); };
async function absorverDano(en) {
  const i = cbInfo(en); const cb = cbEstado();
  const usaMestre = en.tipo === 'npc' && !i.bennies && (S.camp.benesMestre || 0) > 0;
  if (!i.bennies && !usaMestre) { toast('Sem Benes.'); return; }
  const ud = cb.ultimoDano && cb.ultimoDano.id === en.id ? cb.ultimoDano.fer : 0;
  const fer = ud || Math.max(1, i.feridas);
  if (!await confirmar(`Gastar 1 Bene${usaMestre ? ' do mestre' : ''} e rolar Vigor para absorver até <b>${fer}</b> Ferimento(s) de ${esc(en.nome)}?`, 'Absorver', false)) return;
  let res;
  if (en.tipo === 'pc') { await salvarFichaCampo(en.ficha, { bennies: i.bennies - 1 }); ({ res } = await rolarTeste(montarTeste(normFicha(en.ficha), 'atr', 'vig', { titulo: 'Absorver dano', semBene: true }))); }
  else { if (usaMestre) await D.update(cpath(), { benesMestre: S.camp.benesMestre - 1 }); else await npcPatch(en.ficha.id, { bennies: i.bennies - 1 }); ({ res } = await rolarNpcTeste(en.ficha, 'Vigor', +en.ficha.atr.vig || 4, 0, { titulo: 'Absorver dano', semBene: true })); }
  const anula = res.sucesso ? 1 + res.amp : 0;
  if (anula) {
    const i2 = cbInfo(cbEn(en.id) || (en.tipo === 'pc' ? { ...en, ficha: normFicha(S.fichas.find(x => x.id === en.ficha.id) || en.ficha) } : en));
    const tira = Math.min(anula, fer); const novo = Math.max(0, i2.feridas - tira);
    const patch = { feridas: novo, condicoes: novo <= i2.maxF ? i2.conds.filter(c => c !== 'incapacitado') : i2.conds };
    if (anula >= fer) patch.abalado = false;
    await cbPatchEnt(en, patch); if (S.combate && S.combate.ultimoDano) await cbSalvar({ ultimoDano: null });
    toast(`Absorveu ${tira} Ferimento(s)${anula >= fer ? ' e não está mais Abalado' : ''}.`, 'ok');
  } else toast('Não conseguiu absorver o dano. Pode tentar de novo com outro Bene.', 'err');
}
A.cbTrocarCarta = async el => {
  const en = cbEn(el.dataset.id); if (!en) return; const f = en.ficha;

  toast(`${esc(f.nome)} sacou ${cartaTxt(c)}.`);
};

/* ---------- participantes ---------- */
A.cbAddModal = () => {
  const cb = cbEstado(); const dentro = new Set(Object.values(cb.entradas || {}).map(e => e.ref));
  const pcs = S.fichas.filter(f => !dentro.has('pc:' + f.id)); const npcs = S.npcs.filter(n => !dentro.has('npc:' + n.id) && !n.temp);
  abrirModal(`<div class="add-cb">

    <div><h3 class="tit-peq">NPCs</h3>${npcs.map(n => `<div class="chk bloco npc-add"><label><input type="checkbox" name="cbnpc" value="${n.id}"> ${esc(n.nome)} <small>${n.carta === 'selvagem' ? '★' : 'Extra'}</small></label><input class="inp mini-n" type="number" min="1" max="20" value="1" data-qtd="${n.id}" aria-label="Quantidade de ${esc(n.nome)}" title="Quantidade (cópias)"></div>`).join('') || '<p class="dica">Nenhum NPC criado.</p>'}
      <label class="chk bloco"><input type="checkbox" id="cbOcultos"> Entram ocultos para os jogadores (emboscada)</label></div>
    <div><h3 class="tit-peq">Avulso (sem ficha)</h3><div class="linha2"><label class="campo"><span>Nome</span><input class="inp" id="avNome" placeholder="ex.: Segurança 2"></label><label class="campo"><span>Aparar</span><input class="inp mono" type="number" id="avApa" value="5"></label><label class="campo"><span>Resist.</span><input class="inp mono" type="number" id="avRes" value="5"></label></div>
      <label class="chk bloco"><input type="checkbox" id="avAliado"> Aliado dos heróis</label></div>

  $('#cbAddOk').onclick = async () => {

      if (q === 1) ent[uid('e')] = { ref: 'npc:' + n.id, carta: null, oculto };
      else for (let k = 1; k <= q; k++) {
        const id = uid('n'); const c = clone(n); delete c.id; c.nome = `${n.nome} ${k}`; c.feridas = 0; c.abalado = false; c.condicoes = []; c.temp = true;
        await D.set(cpath('npcs/' + id), c); ent[uid('e')] = { ref: 'npc:' + id, carta: null, oculto };
      }
    }
    const nm = $('#avNome').value.trim(); if (nm) ent[uid('e')] = { ref: null, nome: nm, carta: null, lado: $('#avAliado').checked ? 'herois' : 'viloes', avulso: { aparar: +$('#avApa').value || 2, res: +$('#avRes').value || 4, feridas: 0, abalado: false, conds: [] } };

A.cbEntrar = async el => { await cbSalvar({ entradas: { [uid('e')]: { ref: 'pc:' + el.dataset.id, carta: null } } }); toast('Você entrou no combate. Aguarde o mestre distribuir as cartas.'); };
A.cbRemover = async el => {

  await cbSalvarTudo({ ...cb, entradas: ent, turno: cb.turno === el.dataset.id ? null : cb.turno });

};

/* ---------- cartas de ação ---------- */
function comprar(bar) { if (!bar.length) bar.push(...novoBaralho()); return bar.pop(); }
const valorIdx = c => c.curinga ? 99 : VALORES.indexOf(c.v) + 2;
function comprarPara(en, bar) {
  const i = cbInfo(en); const v = i.v || new Set();
  const comp = en.tipo === 'pc' ? deriv(en.ficha).c : {};
  let n = 1; if (v.has('Extremamente Focado')) n = 3; else if (v.has('Focado')) n = 2;
  let cartas = [];
  if (comp['Hesitante'] && n === 1) { cartas = [comprar(bar), comprar(bar)]; const jk = cartas.find(c => c.curinga); return jk || cartas.sort((a, b) => a.peso - b.peso)[0]; }
  for (let k = 0; k < n; k++) cartas.push(comprar(bar));
  let c = cartas.sort((a, b) => b.peso - a.peso)[0];
  if (v.has('Rápido')) { let g = 0; while (!c.curinga && valorIdx(c) <= 5 && g++ < 10) c = comprar(bar); }
  return c;
}
A.cbDistribuir = async () => {
  const cb = cbEstado(); const ents = cbEntradas(true); if (!ents.length) return;
  const teveCuringa = ents.some(x => x.carta && x.carta.curinga) || cb.embaralhar;
  let bar = teveCuringa || !(cb.baralho || []).length ? novoBaralho() : cb.baralho.slice();
  const ent = clone(cb.entradas || {});
  const jaTinha = ents.some(x => x.carta);
  const fora = [];
  for (const en of ents) {
    if (en.e.espera && en.carta) continue; // em espera mantém a ação
    if (cbFora(en)) { ent[en.id].carta = null; fora.push(en.nome); continue; }
    ent[en.id].carta = comprarPara(en, bar);
  }
  const novaRodada = jaTinha ? (cb.rodada || 1) + 1 : (cb.rodada || 1);
  /* condições que só duram até o início do próximo turno saem na nova rodada para quem já agiu */
  await cbSalvarTudo({ ...cb, baralho: bar, entradas: ent, rodada: novaRodada, turno: null, embaralhar: false, turnoSeq: (cb.turnoSeq || 0) + 1 });
  /* Curingas: Benes automáticos */
  const resolvidas = cbEntradasDe(ent);
  const jkHerois = resolvidas.filter(x => x.carta && x.carta.curinga && x.lado === 'herois');
  const jkViloes = resolvidas.filter(x => x.carta && x.carta.curinga && x.lado !== 'herois');
  const msgs = [`${teveCuringa ? 'Baralho embaralhado. ' : ''}Rodada ${novaRodada}: cartas distribuídas.`];
  if (jkHerois.length) {
    const pcs = resolvidas.filter(x => x.tipo === 'pc');
    for (const p of pcs) await salvarFichaCampo(p.ficha, { bennies: (p.ficha.bennies || 0) + jkHerois.length });
    msgs.push(`Curinga para os heróis: cada personagem ganhou ${jkHerois.length > 1 ? jkHerois.length + ' Benes' : '1 Bene'}.`);
  }
  if (jkViloes.length) {
    await D.update(cpath(), { benesMestre: ((S.camp && S.camp.benesMestre) || 0) + jkViloes.length });
    for (const n of resolvidas.filter(x => x.tipo === 'npc' && x.ficha.carta === 'selvagem')) await npcPatch(n.ficha.id, { bennies: (n.ficha.bennies || 0) + jkViloes.length });
    msgs.push('Curinga para os vilões: Bene para o mestre e para cada vilão Carta Selvagem.');
  }
  for (const x of resolvidas.filter(x => x.tipo === 'pc' && x.carta && x.carta.curinga && deriv(x.ficha).v.has('Surto de Poder'))) {
    const a = x.ficha.arcano || {}; await salvarFichaCampo(x.ficha, { arcano: { ...a, pp: Math.min(+a.ppMax || 0, (+a.pp || 0) + 10) } }); msgs.push(`${x.nome}: Surto de Poder, +10 PP.`);
  }
  toast(msgs.map(esc).join('<br>'), jkHerois.length ? 'ok' : '', 6000);
  registrarRolagem({ tipo: 'expr', ts: Date.now(), autor: S.user.uname, personagem: 'Mestre', titulo: `Rodada ${novaRodada}: cartas de ação`, partes: [], final: resolvidas.filter(x => x.carta).length + ' cartas', resumo: '', nivel: 'dano', nota: resolvidas.filter(x => x.carta && !(x.e.oculto)).map(x => `${x.nome} ${cartaTxt(x.carta)}`).join(' · ') });
};
function cbEntradasDe(ent) { const salvo = S.combate; S.combate = { ...(salvo || {}), entradas: ent }; const r = cbEntradas(true); S.combate = salvo; return r; }
A.cbTurno = async el => {
  const cb = cbEstado(); const ents = cbEntradas(true).filter(x => x.carta && !cbFora(x)); if (!ents.length) return;
  let i = ents.findIndex(x => x.id === cb.turno); const d = +el.dataset.d;
  const ant = ents[i];
  if (i < 0) i = 0; else i += d;
  /* fim do turno de quem agia: expiram Distraído/Vulnerável que já existiam no início do turno dele */
  const exp = { ...(cb.exp || {}) };
  if (ant && d > 0 && exp[ant.id]) {
    const i0 = cbInfo(ant); const sai = exp[ant.id];
    const nc = i0.conds.filter(c => !sai.includes(c));
    if (nc.length !== i0.conds.length) await cbPatchEnt(ant, { condicoes: nc });
    delete exp[ant.id];
  }
  if (i >= ents.length) { toast('Fim da rodada. Distribua novas cartas.'); await cbSalvar({ turno: null, exp }); return; }
  if (i < 0) i = 0;
  const en = ents[i]; const inf = cbInfo(en);
  /* início do turno: Defender termina; registra o que expira no fim deste turno */
  if (inf.conds.includes('defendendo')) await cbPatchEnt(en, { condicoes: inf.conds.filter(c => c !== 'defendendo') });
  exp[en.id] = inf.conds.filter(c => c === 'distraido' || c === 'vulneravel');
  await cbSalvar({ turno: en.id, exp, turnoSeq: (cb.turnoSeq || 0) + 1, entradas: en.e.espera ? { [en.id]: { espera: false } } : {} });
};
A.cbFinalizar = async () => {
  if (!await confirmar('Encerrar o combate? Todos saem da ordem de ação e a rodada volta para 1. As fichas não são apagadas; cópias temporárias de NPCs são removidas.', 'Encerrar', false)) return;
  const cb = cbEstado();
  for (const e of Object.values(cb.entradas || {})) if (e.ref && e.ref.startsWith('npc:')) { const n = S.npcs.find(x => x.id === e.ref.slice(4)); if (n && n.temp) await D.del(cpath('npcs/' + n.id)).catch(() => { }); }
  for (const id of Object.keys(S.tokens)) await D.del(cpath('tokens/' + id)).catch(() => { });
  await cbSalvarTudo({ ...cb, entradas: {}, rodada: 1, turno: null, baralho: novoBaralho(), embaralhar: false, modelos: {}, exp: {}, ultimoDano: null });

};

/* automação ao mudar de turno: cada cliente cuida do que é seu

let cbUltimoSeq = null;
function cbAoMudar() {
  const cb = S.combate; if (!cb || !S.user) return;
  const seq = cb.turnoSeq || 0;
  if (cbUltimoSeq === null) { cbUltimoSeq = seq; return; }
  if (seq === cbUltimoSeq) return;
  cbUltimoSeq = seq;
  S.multi = 0;
  const en = cb.turno ? cbEntradas(true).find(x => x.id === cb.turno) : null;
  if (!en) return;
  const meu = en.tipo === 'pc' ? (en.ficha.dono === S.user.uname || (!en.ficha.dono && S.gm)) : S.gm;
  if (en.tipo === 'pc' && en.ficha.dono === S.user.uname) toast(`<b>Sua vez, ${esc(en.nome)}!</b>`, 'ok', 4000);
  if (!meu || cb.autoRecuperar === false) return;
  const i = cbInfo(en);
  if (i.abalado || i.conds.includes('atordoado')) setTimeout(() => rolarRecuperacao(en, true), 400);
  if (i.conds.includes('sangrando')) toast(`${esc(en.nome)} está Sangrando: role Vigor no início do turno.`, 'err', 6000);
}

    <div class="campo"><span>Iluminação</span><div class="seg amb-seg" role="group">${LUZES.map(l => `<button class="seg-b ${+amb.luz === l[0] ? 'on' : ''}" data-luz="${l[0]}">${l[1]}${l[0] ? ' −' + l[0] : ''}</button>`).join('')}</div><small class="dica" id="ambLuzDica"></small></div>

  </div><div class="modal-acoes"><button class="btn fant" data-a="fecharModal">Cancelar</button><button class="btn pri" id="ambOk">Aplicar</button></div>`, { titulo: 'Ambiente da cena', cls: 'estreito' });

  $('#modal .amb-seg').onclick = e => { const b = e.target.closest('[data-luz]'); if (!b) return; amb.luz = +b.dataset.luz; $$('#modal [data-luz]').forEach(x => x.classList.toggle('on', x === b)); dicas(); };
  $('#modal .amb-climas').onclick = e => { const b = e.target.closest('[data-clima]'); if (!b) return; amb.clima = b.dataset.clima; $$('#modal [data-clima]').forEach(x => x.classList.toggle('on', x === b));
    if ((amb.clima === 'neblina' || amb.clima === 'cinzas') && !amb.luz) { amb.luz = 2; $$('#modal [data-luz]').forEach(x => x.classList.toggle('on', +x.dataset.luz === 2)); } dicas(); };
  dicas();
  $('#ambOk').onclick = async () => { await cbSalvar({ ambiente: { luz: +amb.luz || 0, clima: amb.clima || '' }, autoRecuperar: $('#ambAuto').checked }); fecharModal(); };

AF.push(() => cbAoMudar());

function danoEmArea(id) {
  const md = (cbEstado().modelos || {})[id]; if (!md) return; const alvos = alvosDoModelo(md);
  abrirModal(`<form id="daF" class="pilha"><div class="linha2"><label class="campo"><span>Dano</span><input class="inp mono" id="daExpr" value="${md.tipo === 'cone' ? '2d6' : '3d6'}" required></label><label class="campo"><span>PA</span><input class="inp mono" type="number" id="daPa" value="0" min="0"></label></div>
    <p class="dica">Uma rolagem de dano vale para todos na área (${alvos.map(a => esc(a.nome)).join(', ')}). Quem quiser pode tentar Evasão antes.</p>
    <div id="daRes" class="pilha"></div>
    <div class="modal-acoes"><button type="button" class="btn fant" data-a="fecharModal">Fechar</button><button class="btn sec" id="daRolar">Rolar dano</button><button type="button" class="btn perigo" id="daAplicar" disabled>Aplicar em todos</button></div></form>`, { titulo: 'Dano em área: ' + MODELOS_AREA[md.tipo].nome, cls: 'estreito' });
  let calcs = null;
  $('#daF').onsubmit = async e => {
    e.preventDefault();
    try {
      const r = await rolarExpressao('Dano em área', $('#daExpr').value, {}, { personagem: 'Mestre' });
      const pa = +$('#daPa').value || 0;
      calcs = alvos.map(a => ({ a, c: calcDano(cbInfo(a), r.total, pa), sel: true }));
      $('#daRes').innerHTML = `<p><b class="mono">${r.total}</b> de dano</p>` + calcs.map((x, k) => `<label class="chk bloco"><input type="checkbox" data-k="${k}" checked> <b>${esc(x.a.nome)}</b> <small>${esc(x.c.txt)}</small></label>`).join('');
      $$('#daRes [data-k]').forEach(i => { i.onchange = () => { calcs[+i.dataset.k].sel = i.checked; }; });
      $('#daAplicar').disabled = false;
    } catch (er) { toast(esc(er.message), 'err'); }
  };
  $('#daAplicar').onclick = async () => { for (const x of calcs.filter(x => x.sel)) await aplicarDano(x.a, x.c, 'área'); fecharModal(); toast('Dano em área aplicado.'); };
}

<script>
/* =====================================================================
   MAPA DE BATALHA — no espírito do Owlbear Rodeo, adaptado ao Savage Worlds
   Dados da campanha (todos sincronizados):
   • estado/mapa  → {cenaAtiva, livre, cenas:{id:{nome, criadaEm, mapas:{mid:{nome, ref, imgW, imgH, mapaW, mapaX, mapaY}},
                     mapaAtivo, grade:{visivel, cor, opacidade, metros}, nevoa:{ativa, areas[]}, escuridao:{ativa, areas[]}, terremoto}}}

   Ferramentas: mover (V), régua (R), ponto (P), área (A), desenhar (D), borracha (E),

   ===================================================================== */
const BM_CELL = 70;
const BM_LUZES = {
  tocha: { nome: 'Tocha', icone: '🔥', escuro: 4, nevoa: 5, cor: '255,170,80' },

const BM_CORES_DESENHO = ['#f3d36a', '#ff5a4f', '#5fd0ff', '#7ee08a', '#d79bff', '#ffffff', '#111111'];

let bmNode = null, bmAg = false, bmArr = null;
let bmView = { z: 1, x: 0, y: 0, chave: null };
let bmFerr = 'mover', bmDesenho = { forma: 'livre', cor: '#f3d36a', esp: 4 }, bmModeloTipo = 'me';
let bmNevoaModo = 'revelar', bmEscuroModo = 'iluminar', bmAjustando = false;
let bmSel = null, bmGaveta = null, bmClimaAberto = false, bmTelaCheia = false;
let bmRecolhido = lsGet('wc.bmRec', false);

/* ---------- dados ---------- */
const bmCfg = () => S.mapaCfg || { cenaAtiva: null, cenas: {} };
const bmCena = () => { const c = bmCfg(); return c.cenaAtiva && c.cenas ? c.cenas[c.cenaAtiva] || null : null; };
const bmMestre = () => !!S.gm;
function bmSalvarCfg(patch) {

}
function bmSalvarCena(id, patch) { const c = bmCfg(); return bmSalvarCfg({ cenas: { ...(c.cenas || {}), [id]: { ...((c.cenas || {})[id] || {}), ...patch } } }); }
function bmGradePadrao() { return { visivel: true, cor: '#000000', opacidade: 0.35, metros: 2 }; }
function bmMapasLista(cena) { return cena && cena.mapas ? Object.entries(cena.mapas).sort((a, b) => (a[1].criadoEm || 0) - (b[1].criadoEm || 0)) : []; }
function bmMapaId(cena) { const l = bmMapasLista(cena); if (!l.length) return null; return cena.mapaAtivo && cena.mapas[cena.mapaAtivo] ? cena.mapaAtivo : l[0][0]; }
function bmMapa(cena) { const id = bmMapaId(cena); return id ? cena.mapas[id] : null; }
function bmSalvarMapa(cid, patch) {
  const cena = bmCfg().cenas[cid]; const mid = bmMapaId(cena); if (!mid) return;

}
function bmCriarCena(comImagem) {

async function bmEscolherImagem(cid, novo) {

/* ---------- geometria ---------- */
function bmLimites(cena) {
  const m = bmMapa(cena);
  if (m && m.ref && m.imgW) { const w = (m.mapaW || 20) * BM_CELL; return { x: (m.mapaX || 0) * BM_CELL, y: (m.mapaY || 0) * BM_CELL, w, h: w * m.imgH / m.imgW }; }
  return { x: 0, y: 0, w: 24 * BM_CELL, h: 14 * BM_CELL };
}
const bmVp = () => bmNode ? $('.bm-vp', bmNode) : null;
function bmEnquadrar() {

}
const bmCentroCelula = w => ({ x: (Math.floor(w.x / BM_CELL) + 0.5) * BM_CELL, y: (Math.floor(w.y / BM_CELL) + 0.5) * BM_CELL });

/* ---------- tokens ---------- */
const tamTk = tam => tam >= 12 ? 4 : tam >= 8 ? 3 : tam >= 4 ? 2 : 1;
const bmChave = eid => (bmCfg().cenaAtiva || '_') + '__' + eid;
function bmTk(en, i, cena) {

  const L = bmLimites(cena || bmCena()); const bx = Math.floor(L.x / BM_CELL) + 1, by = Math.floor(L.y / BM_CELL) + 1;

function bmPos(eid) { const ents = cbEntradas(true); const i = ents.findIndex(x => x.id === eid); return i < 0 ? { x: 0, y: 0, tam: 1 } : bmTk(ents[i], i); }
function bmTemPosicoes(...ids) { return ids.every(id => !!S.tokens[bmChave(id)]); }
/* distância em quadros (no Savage, diagonais contam 1) entre dois participantes, borda a borda */
function bmDist(idA, idB) {

const bmDono = en => !!(en && en.tipo === 'pc' && en.ficha && en.ficha.dono === S.user.uname);

function bmPodeMover(en) {
